<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Verify email · Codex Hub</title>
  <style>
    :root { --indigo:#4F46E5; --indigo2:#7C3AED; --bg:#F1F5F9; --text:#0f172a; --muted:#64748b; --line:#E2E8F0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, #EEF2FF 0%, var(--bg) 50%, #fff 100%);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      padding: 20px 16px; min-height: 100dvh;
    }
    .card {
      width: min(400px, 100%); background: #fff; border: 1px solid var(--line);
      border-radius: 20px; padding: 28px 22px 24px;
      box-shadow: 0 18px 48px rgba(15,23,42,.1); overflow: hidden;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-weight: 800; }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--indigo), var(--indigo2));
      color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800;
    }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    .hint { margin: 0 0 18px; color: var(--muted); font-size: .9rem; line-height: 1.45; word-break: break-word; }
    .code-row { display: flex; gap: 8px; justify-content: center; width: 100%; margin: 0 0 18px; }
    .code-row input {
      flex: 1 1 0; min-width: 0; max-width: 48px; height: 50px; text-align: center;
      font-size: 1.25rem; font-weight: 800; border: 1.5px solid var(--line); border-radius: 12px;
      background: #F8FAFC; -webkit-appearance: none; appearance: none;
    }
    .code-row input:focus { outline: 2px solid #C7D2FE; border-color: var(--indigo); background: #fff; }
    button.pri {
      width: 100%; height: 48px; border: 0; border-radius: 14px; font-weight: 800; cursor: pointer;
      background: linear-gradient(135deg, var(--indigo), var(--indigo2)); color: #fff; font-size: 1rem;
    }
    button.pri:disabled, button.ghost:disabled { opacity: .55; cursor: not-allowed; }
    button.ghost {
      width: 100%; margin-top: 10px; height: 44px; border: 0; border-radius: 12px;
      background: #F1F5F9; font-weight: 700; cursor: pointer; color: #334155;
    }
    .msg { min-height: 1.25em; font-size: .88rem; margin-top: 12px; text-align: center; line-height: 1.4; }
    .msg.err { color: #DC2626; }
    .msg.ok { color: #059669; }
    .msg.info { color: #475569; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="logo">CX</div> Codex Hub</div>
    <h1>Verify your email</h1>
    <p class="hint" id="hint">Enter the 6-digit code from your email. Check Spam. Code expires in 3 minutes.</p>
    <div class="code-row" id="digits">
      <input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 2" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 3" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 4" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 5" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 6" />
    </div>
    <button class="pri" type="button" id="btnVerify">Verify</button>
    <button class="ghost" type="button" id="btnResend">Resend code</button>
    <p class="msg" id="msg"></p>
  </div>
  <script>
    (function () {
      var BACKEND = "https://codex-backend-new.onrender.com";
      var inputs = [].slice.call(document.querySelectorAll("#digits input"));
      var msg = document.getElementById("msg");
      var btnVerify = document.getElementById("btnVerify");
      var btnResend = document.getElementById("btnResend");
      var sending = false;

      function setMsg(t, kind) {
        msg.textContent = t || "";
        msg.className = "msg " + (kind || (t ? "err" : ""));
      }
      function codeValue() {
        return inputs.map(function (i) { return (i.value || "").replace(/\D/g, ""); }).join("");
      }
      inputs.forEach(function (inp, idx) {
        inp.addEventListener("input", function () {
          inp.value = (inp.value || "").replace(/\D/g, "").slice(0, 1);
          if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && !inp.value && idx > 0) inputs[idx - 1].focus();
        });
        inp.addEventListener("paste", function (e) {
          var p = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\D/g, "").slice(0, 6);
          if (p.length > 1) {
            e.preventDefault();
            for (var i = 0; i < 6; i++) inputs[i].value = p[i] || "";
            inputs[Math.min(p.length, 5)].focus();
          }
        });
      });

      function withTimeout(promise, ms, label) {
        return new Promise(function (resolve, reject) {
          var done = false;
          var timer = setTimeout(function () {
            if (done) return;
            done = true;
            reject(new Error((label || "Request") + " timed out. Use VPN if needed, then Resend."));
          }, ms);
          promise.then(function (v) {
            if (done) return; done = true; clearTimeout(timer); resolve(v);
          }, function (e) {
            if (done) return; done = true; clearTimeout(timer); reject(e);
          });
        });
      }

      function getToken() {
        var user = firebase.auth().currentUser;
        if (!user) return Promise.reject(new Error("Not signed in. Go to Login, sign in, then open this page again."));
        // Cached first — avoids hanging on Google when network blocks identitytoolkit
        return withTimeout(user.getIdToken(false), 10000, "Auth token")
          .then(function (tok) {
            if (tok && String(tok).length > 20) return String(tok);
            return withTimeout(user.getIdToken(true), 12000, "Auth refresh");
          })
          .then(function (tok) {
            if (!tok || String(tok).length < 20) {
              throw new Error("Could not read session. Log in again (VPN helps), then Resend.");
            }
            return String(tok);
          });
      }

      function api(path, bodyObj, ms) {
        return getToken().then(function (tok) {
          var body = Object.assign({ idToken: tok }, bodyObj || {});
          var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
          var opts = {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + tok
            },
            body: JSON.stringify(body)
          };
          if (ctrl) opts.signal = ctrl.signal;
          var p = fetch(BACKEND + path, opts).then(function (r) {
            return r.text().then(function (text) {
              var j = {};
              try { j = text ? JSON.parse(text) : {}; } catch (_) {}
              return { r: r, j: j };
            });
          });
          return withTimeout(p, ms || 45000, "Server").catch(function (e) {
            if (ctrl) try { ctrl.abort(); } catch (_) {}
            throw e;
          });
        });
      }

      function sendCode() {
        if (sending) return;
        sending = true;
        setMsg("Sending code…", "info");
        btnResend.disabled = true;
        api("/auth/send-verify-code", {}, 45000)
          .then(function (x) {
            sending = false;
            btnResend.disabled = false;
            if (x.j && x.j.alreadyVerified) {
              setMsg("Already verified. Redirecting…", "ok");
              setTimeout(function () { location.href = "app/home.html"; }, 500);
              return;
            }
            if (!x.r.ok) {
              throw new Error((x.j && x.j.error) || ("Send failed (" + x.r.status + ")"));
            }
            setMsg("Code sent. Check inbox for codexhub16@gmail.com (and Spam).", "ok");
          })
          .catch(function (e) {
            sending = false;
            btnResend.disabled = false;
            var m = (e && e.message) || "Could not send code";
            if (/Failed to fetch|NetworkError|abort/i.test(m)) {
              m = "Cannot reach server. Wait 30s or use VPN, then Resend.";
            }
            setMsg(m, "err");
          });
      }

      function checkCode() {
        var c = codeValue();
        if (c.length !== 6) { setMsg("Enter all 6 digits", "err"); return; }
        setMsg("Checking…", "info");
        btnVerify.disabled = true;
        api("/auth/check-verify-code", { code: c }, 30000)
          .then(function (x) {
            btnVerify.disabled = false;
            if (!x.r.ok) throw new Error((x.j && x.j.error) || "Wrong code");
            setMsg("Verified! Opening Codex Hub…", "ok");
            var user = firebase.auth().currentUser;
            return (user ? user.reload().catch(function () {}) : Promise.resolve()).then(function () {
              location.href = "chooseFaculty.html";
            });
          })
          .catch(function (e) {
            btnVerify.disabled = false;
            setMsg((e && e.message) || "Verification failed", "err");
          });
      }

      btnVerify.onclick = checkCode;
      btnResend.onclick = function () { sendCode(); };

      var authReady = false;
      firebase.auth().onAuthStateChanged(function (user) {
        if (authReady) return;
        authReady = true;
        if (!user) {
          setMsg("Please sign in first", "err");
          setTimeout(function () { location.href = "login.html"; }, 1000);
          return;
        }
        if (user.emailVerified) {
          setMsg("Already verified.", "ok");
          setTimeout(function () { location.href = "app/home.html"; }, 400);
          return;
        }
        document.getElementById("hint").textContent =
          "Code goes to " + (user.email || "your email") + " from Codex Hub / codexhub16@gmail.com.";
        sendCode();
      });

      setTimeout(function () {
        if (!authReady) {
          setMsg("Auth is blocked or slow. Turn on VPN, open Login, then come back.", "err");
        }
      }, 18000);
    })();
  </script>
</body>
</html>
