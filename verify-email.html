<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify email · Codex Hub</title>
  <style>
    :root { --indigo:#4F46E5; --bg:#F8FAFC; --text:#0f172a; --muted:#64748b; --line:#E2E8F0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(165deg, #EEF2FF 0%, var(--bg) 45%, #fff 100%); color: var(--text);
      display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:min(420px,100%); background:#fff; border:1px solid var(--line); border-radius:20px;
      padding:28px 24px; box-shadow:0 20px 50px rgba(15,23,42,.08); }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:18px; font-weight:800; }
    .brand span { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#4F46E5,#7C3AED);
      color:#fff; display:grid; place-items:center; font-size:14px; }
    h1 { font-size:1.25rem; margin:0 0 6px; }
    p { margin:0 0 14px; color:var(--muted); font-size:.92rem; line-height:1.45; }
    .code-row { display:flex; gap:8px; justify-content:center; margin:18px 0; }
    .code-row input { width:44px; height:52px; text-align:center; font-size:1.35rem; font-weight:800;
      border:1.5px solid var(--line); border-radius:12px; }
    .code-row input:focus { outline:2px solid #C7D2FE; border-color:var(--indigo); }
    button.pri { width:100%; height:48px; border:0; border-radius:14px; font-weight:800; cursor:pointer;
      background:linear-gradient(135deg,#4F46E5,#7C3AED); color:#fff; font-size:1rem; }
    button.pri:disabled { opacity:.55; cursor:not-allowed; }
    button.ghost { width:100%; margin-top:10px; height:44px; border:0; border-radius:12px; background:#F1F5F9;
      font-weight:700; cursor:pointer; color:#334155; }
    .msg { min-height:1.2em; font-size:.88rem; margin-top:10px; text-align:center; }
    .msg.err { color:#DC2626; }
    .msg.ok { color:#059669; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <div class="card">
    <div class="brand"><span>CX</span> Codex Hub</div>
    <h1>Verify your email</h1>
    <p id="hint">We sent a 6-digit code to your inbox (check Spam). Enter it below. Code expires in 3 minutes.</p>
    <div class="code-row" id="digits">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 1" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 2" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 3" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 4" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 5" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 6" />
    </div>
    <button class="pri" type="button" id="btnVerify">Verify</button>
    <button class="ghost" type="button" id="btnResend">Resend code</button>
    <p class="msg" id="msg"></p>
  </div>
  <script>
    (function () {
      var BACKEND = "https://codex-backend-new.onrender.com";
      var inputs = [].slice.call(document.querySelectorAll("#digits input"));
      var msg = document.getElementById("msg");
      function setMsg(t, ok) {
        msg.textContent = t || "";
        msg.className = "msg " + (ok ? "ok" : t ? "err" : "");
      }
      function codeValue() {
        return inputs.map(function (i) { return i.value; }).join("");
      }
      inputs.forEach(function (inp, idx) {
        inp.addEventListener("input", function () {
          inp.value = inp.value.replace(/\D/g, "").slice(0, 1);
          if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && !inp.value && idx > 0) inputs[idx - 1].focus();
        });
        inp.addEventListener("paste", function (e) {
          var p = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, 6);
          if (p.length > 1) {
            e.preventDefault();
            for (var i = 0; i < 6; i++) inputs[i].value = p[i] || "";
            inputs[Math.min(p.length, 5)].focus();
          }
        });
      });

      function authHeaders() {
        return firebase.auth().currentUser.getIdToken().then(function (tok) {
          return { "Content-Type": "application/json", Authorization: "Bearer " + tok };
        });
      }

      function sendCode() {
        setMsg("Sending…");
        return authHeaders().then(function (h) {
          return fetch(BACKEND + "/auth/send-verify-code", { method: "POST", headers: h, body: "{}" });
        }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
          .then(function (x) {
            if (x.j.alreadyVerified) {
              setMsg("Already verified. Redirecting…", true);
              location.href = "app/home.html";
              return;
            }
            if (!x.r.ok) throw new Error(x.j.error || "Send failed");
            setMsg("Code sent. Check inbox / Spam.", true);
          })
          .catch(function (e) { setMsg(e.message || "Could not send"); });
      }

      function checkCode() {
        var c = codeValue();
        if (c.length !== 6) { setMsg("Enter all 6 digits"); return; }
        setMsg("Checking…");
        document.getElementById("btnVerify").disabled = true;
        authHeaders().then(function (h) {
          return fetch(BACKEND + "/auth/check-verify-code", {
            method: "POST", headers: h, body: JSON.stringify({ code: c })
          });
        }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
          .then(function (x) {
            document.getElementById("btnVerify").disabled = false;
            if (!x.r.ok) throw new Error(x.j.error || "Wrong code");
            setMsg("Verified! Opening Codex Hub…", true);
            return firebase.auth().currentUser.reload().then(function () {
              location.href = "chooseFaculty.html";
            });
          })
          .catch(function (e) {
            document.getElementById("btnVerify").disabled = false;
            setMsg(e.message || "Failed");
          });
      }

      document.getElementById("btnVerify").onclick = checkCode;
      document.getElementById("btnResend").onclick = sendCode;

      firebase.auth().onAuthStateChanged(function (user) {
        if (!user) {
          setMsg("Please sign in first");
          setTimeout(function () { location.href = "login.html"; }, 1200);
          return;
        }
        if (user.emailVerified) {
          setMsg("Already verified.", true);
          location.href = "app/home.html";
          return;
        }
        document.getElementById("hint").textContent =
          "We sent a 6-digit code to " + (user.email || "your email") + ". Check Spam if needed.";
        sendCode();
      });
    })();
  </script>
</body>
</html>
