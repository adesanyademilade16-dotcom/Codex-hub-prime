<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Verify email · Codex Hub</title>
  <style>
    :root {
      --indigo: #4F46E5;
      --indigo2: #7C3AED;
      --bg: #F1F5F9;
      --text: #0f172a;
      --muted: #64748b;
      --line: #E2E8F0;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, #EEF2FF 0%, var(--bg) 50%, #fff 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      min-height: 100dvh;
    }
    .card {
      width: min(400px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 22px 24px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-weight: 800;
      font-size: 1rem;
    }
    .brand .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--indigo), var(--indigo2));
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .hint {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .code-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
      margin: 0 0 18px;
      padding: 0;
    }
    .code-row input {
      flex: 1 1 0;
      min-width: 0;
      max-width: 48px;
      height: 50px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #F8FAFC;
      color: var(--text);
      -webkit-appearance: none;
      appearance: none;
    }
    .code-row input:focus {
      outline: 2px solid #C7D2FE;
      border-color: var(--indigo);
      background: #fff;
    }
    button.pri {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, var(--indigo), var(--indigo2));
      color: #fff;
      font-size: 1rem;
    }
    button.pri:disabled { opacity: 0.55; cursor: not-allowed; }
    button.ghost {
      width: 100%;
      margin-top: 10px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: #F1F5F9;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
    }
    .msg {
      min-height: 1.25em;
      font-size: 0.88rem;
      margin-top: 12px;
      text-align: center;
      line-height: 1.4;
    }
    .msg.err { color: #DC2626; }
    .msg.ok { color: #059669; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="logo">CX</div> Codex Hub</div>
    <h1>Verify your email</h1>
    <p class="hint" id="hint">We sent a 6-digit code to your inbox (check Spam). Enter it below. Expires in 3 minutes.</p>
    <div class="code-row" id="digits" aria-label="Verification code">
      <input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 2" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 3" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 4" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 5" />
      <input inputmode="numeric" maxlength="1" aria-label="Digit 6" />
    </div>
    <button class="pri" type="button" id="btnVerify">Verify</button>
    <button class="ghost" type="button" id="btnResend">Resend code</button>
    <p class="msg" id="msg"></p>
  </div>
  <script>
    (function () {
      var BACKEND = "https://codex-backend-new.onrender.com";
      var inputs = [].slice.call(document.querySelectorAll("#digits input"));
      var msg = document.getElementById("msg");
      var btnVerify = document.getElementById("btnVerify");
      var btnResend = document.getElementById("btnResend");

      function setMsg(t, ok) {
        msg.textContent = t || "";
        msg.className = "msg " + (ok ? "ok" : t ? "err" : "");
      }
      function codeValue() {
        return inputs.map(function (i) { return (i.value || "").replace(/\D/g, ""); }).join("");
      }

      inputs.forEach(function (inp, idx) {
        inp.addEventListener("input", function () {
          inp.value = (inp.value || "").replace(/\D/g, "").slice(0, 1);
          if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && !inp.value && idx > 0) inputs[idx - 1].focus();
        });
        inp.addEventListener("paste", function (e) {
          var p = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\D/g, "").slice(0, 6);
          if (p.length > 1) {
            e.preventDefault();
            for (var i = 0; i < 6; i++) inputs[i].value = p[i] || "";
            inputs[Math.min(p.length, 5)].focus();
          }
        });
      });

      function authHeaders() {
        var user = firebase.auth().currentUser;
        if (!user) return Promise.reject(new Error("Not signed in"));
        return user.getIdToken(true).then(function (tok) {
          return {
            "Content-Type": "application/json",
            Authorization: "Bearer " + tok
          };
        });
      }

      function sendCode() {
        setMsg("Sending code…");
        btnResend.disabled = true;
        return authHeaders()
          .then(function (h) {
            return fetch(BACKEND + "/auth/send-verify-code", {
              method: "POST",
              headers: h,
              body: "{}"
            });
          })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            btnResend.disabled = false;
            if (x.j && x.j.alreadyVerified) {
              setMsg("Already verified. Redirecting…", true);
              setTimeout(function () { location.href = "app/home.html"; }, 600);
              return;
            }
            if (!x.r.ok) throw new Error((x.j && x.j.error) || "Could not send code");
            setMsg("Code sent from Codex Hub. Check inbox / Spam.", true);
          })
          .catch(function (e) {
            btnResend.disabled = false;
            setMsg(e.message || "Could not send code");
          });
      }

      function checkCode() {
        var c = codeValue();
        if (c.length !== 6) {
          setMsg("Enter all 6 digits");
          return;
        }
        setMsg("Checking…");
        btnVerify.disabled = true;
        authHeaders()
          .then(function (h) {
            return fetch(BACKEND + "/auth/check-verify-code", {
              method: "POST",
              headers: h,
              body: JSON.stringify({ code: c })
            });
          })
          .then(function (r) {
            return r.json().then(function (j) {
              return { r: r, j: j };
            });
          })
          .then(function (x) {
            btnVerify.disabled = false;
            if (!x.r.ok) throw new Error((x.j && x.j.error) || "Wrong code");
            setMsg("Verified! Opening Codex Hub…", true);
            var user = firebase.auth().currentUser;
            return (user ? user.reload() : Promise.resolve()).then(function () {
              location.href = "chooseFaculty.html";
            });
          })
          .catch(function (e) {
            btnVerify.disabled = false;
            setMsg(e.message || "Verification failed");
          });
      }

      btnVerify.addEventListener("click", checkCode);
      btnResend.addEventListener("click", sendCode);

      firebase.auth().onAuthStateChanged(function (user) {
        if (!user) {
          setMsg("Please sign in first");
          setTimeout(function () { location.href = "login.html"; }, 1000);
          return;
        }
        if (user.emailVerified) {
          setMsg("Already verified.", true);
          setTimeout(function () { location.href = "app/home.html"; }, 500);
          return;
        }
        document.getElementById("hint").textContent =
          "We sent a 6-digit code to " + (user.email || "your email") +
          ". Check Spam if you do not see it. Code expires in 3 minutes.";
        sendCode();
      });
    })();
  </script>
</body>
</html>
