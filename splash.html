<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4F46E5" />
  <title>Codex Hub</title>
  <style>
    html, body { margin: 0; height: 100%; background: linear-gradient(160deg, #4F46E5, #7C3AED); }
    body { display: grid; place-items: center; font-family: system-ui, sans-serif; color: #fff; }
    .box { text-align: center; padding: 24px; }
    .logo { width: 72px; height: 72px; border-radius: 18px; background: #fff; display: grid; place-items: center;
      margin: 0 auto 16px; font-weight: 900; color: #4F46E5; font-size: 1.4rem; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    p { opacity: .9; font-size: .9rem; }
    .spin { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
      border-radius: 50%; margin: 20px auto 0; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">CX</div>
    <div style="font-weight:800;font-size:1.25rem">Codex Hub</div>
    <p>Loading your study space…</p>
    <div class="spin" aria-hidden="true"></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    (function () {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      var auth = firebase.auth();
      try {
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      } catch (e) {}
      if (/source=pwa/i.test(location.search)) {
        try { sessionStorage.setItem("codex_pwa", "1"); } catch (e) {}
      }
      var done = false;
      function go(url) {
        if (done) return;
        done = true;
        location.replace(url);
      }
      // Timeout: never leave user stuck on splash
      setTimeout(function () {
        if (!done) go(auth.currentUser ? "app/home.html" : "login.html");
      }, 8000);
      auth.onAuthStateChanged(function (user) {
        if (user) go("app/home.html");
        else go("login.html");
      });
    })();
  </script>
</body>
</html>
