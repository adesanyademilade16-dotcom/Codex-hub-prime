<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset password · Codex Hub</title>
  <style>
    :root { --indigo:#4F46E5; --indigo2:#7C3AED; --bg:#F1F5F9; --text:#0f172a; --muted:#64748b; --line:#E2E8F0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(165deg, #EEF2FF 0%, var(--bg) 50%, #fff 100%);
      color: var(--text); display: flex; align-items: center; justify-content: center; padding: 20px 16px;
    }
    .card {
      width: min(400px, 100%); background: #fff; border: 1px solid var(--line);
      border-radius: 20px; padding: 28px 22px 24px; box-shadow: 0 18px 48px rgba(15,23,42,.1);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-weight: 800; }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--indigo), var(--indigo2));
      color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800;
    }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    p.hint { margin: 0 0 16px; color: var(--muted); font-size: .9rem; line-height: 1.45; }
    label { display: block; font-size: .8rem; font-weight: 700; margin: 12px 0 6px; color: #334155; }
    input[type="email"], input[type="password"] {
      width: 100%; height: 46px; border: 1.5px solid var(--line); border-radius: 12px;
      padding: 0 12px; font-size: 1rem; background: #F8FAFC;
    }
    input:focus { outline: 2px solid #C7D2FE; border-color: var(--indigo); background: #fff; }
    .code-row { display: flex; gap: 8px; justify-content: center; margin: 12px 0 8px; }
    .code-row input {
      flex: 1 1 0; min-width: 0; max-width: 48px; height: 50px; text-align: center;
      font-size: 1.25rem; font-weight: 800; border: 1.5px solid var(--line); border-radius: 12px;
      background: #F8FAFC; -webkit-appearance: none;
    }
    button.pri {
      width: 100%; height: 48px; margin-top: 16px; border: 0; border-radius: 14px; font-weight: 800;
      cursor: pointer; background: linear-gradient(135deg, var(--indigo), var(--indigo2)); color: #fff;
    }
    button.ghost {
      width: 100%; height: 44px; margin-top: 10px; border: 0; border-radius: 12px;
      background: #F1F5F9; font-weight: 700; cursor: pointer; color: #334155;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .msg { min-height: 1.2em; margin-top: 12px; text-align: center; font-size: .88rem; }
    .msg.err { color: #DC2626; }
    .msg.ok { color: #059669; }
    .msg.info { color: #475569; }
    .alt { margin-top: 14px; text-align: center; font-size: .85rem; }
    .alt a { color: var(--indigo); font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="logo">CX</div> Codex Hub</div>
    <h1>Reset password</h1>
    <p class="hint" id="hint">Enter your email. We’ll send a 6-digit code (not a Firebase link).</p>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" placeholder="you@gmail.com" />
    <div id="stepCode" style="display:none">
      <label>Code from email</label>
      <div class="code-row" id="digits">
        <input inputmode="numeric" maxlength="1" />
        <input inputmode="numeric" maxlength="1" />
        <input inputmode="numeric" maxlength="1" />
        <input inputmode="numeric" maxlength="1" />
        <input inputmode="numeric" maxlength="1" />
        <input inputmode="numeric" maxlength="1" />
      </div>
      <label for="pass">New password</label>
      <input type="password" id="pass" autocomplete="new-password" placeholder="At least 6 characters" />
      <label for="pass2">Confirm password</label>
      <input type="password" id="pass2" autocomplete="new-password" />
    </div>
    <button class="pri" type="button" id="btnMain">Send code</button>
    <button class="ghost" type="button" id="btnResend" style="display:none">Resend code</button>
    <p class="msg" id="msg"></p>
    <p class="alt"><a href="login.html">Back to login</a></p>
  </div>
  <script>
  (function () {
    var BACKEND = "https://codex-backend-new.onrender.com";
    var emailEl = document.getElementById("email");
    var stepCode = document.getElementById("stepCode");
    var btnMain = document.getElementById("btnMain");
    var btnResend = document.getElementById("btnResend");
    var msg = document.getElementById("msg");
    var inputs = [].slice.call(document.querySelectorAll("#digits input"));
    var phase = "email"; // email | code

    try {
      var q = new URLSearchParams(location.search).get("email");
      if (q) emailEl.value = q;
    } catch (e) {}

    function setMsg(t, kind) {
      msg.textContent = t || "";
      msg.className = "msg " + (kind || (t ? "err" : ""));
    }
    function codeValue() {
      return inputs.map(function (i) { return (i.value || "").replace(/\D/g, ""); }).join("");
    }
    inputs.forEach(function (inp, idx) {
      inp.addEventListener("input", function () {
        inp.value = (inp.value || "").replace(/\D/g, "").slice(0, 1);
        if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
      });
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Backspace" && !inp.value && idx > 0) inputs[idx - 1].focus();
      });
    });

    function raceTimeout(ms, label) {
      return new Promise(function (_, reject) {
        setTimeout(function () { reject(new Error(label || "Timed out")); }, ms);
      });
    }
    // Reads the response as text first and only then tries JSON.parse — the
    // backend is on Render's free tier, which cold-starts after inactivity
    // (their own dashboard warns this can take 50+ seconds). A fetch that
    // lands mid-cold-start can get a non-JSON response, and plain r.json()
    // would throw a confusing "Unexpected token" error instead of something
    // the person can actually act on.
    function fetchJson(url, body, timeoutMs, timeoutLabel) {
      return Promise.race([
        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (r) {
          return r.text().then(function (text) {
            var j = {};
            try { j = text ? JSON.parse(text) : {}; } catch (e) {}
            return { r: r, j: j };
          });
        }),
        raceTimeout(timeoutMs, timeoutLabel)
      ]);
    }

    function sendCode() {
      var email = (emailEl.value || "").trim().toLowerCase();
      if (!email || email.indexOf("@") < 0) { setMsg("Enter a valid email", "err"); return; }
      btnMain.disabled = true;
      btnResend.disabled = true;
      setMsg("Sending code… (first request can take a bit if the server was asleep)", "info");
      fetchJson(BACKEND + "/auth/send-reset-code", { email: email }, 40000, "Server timed out. Wait a few seconds and try again.")
        .then(function (x) {
          btnMain.disabled = false;
          btnResend.disabled = false;
          if (!x.r.ok) throw new Error((x.j && x.j.error) || "Could not send");
          phase = "code";
          stepCode.style.display = "block";
          btnMain.textContent = "Set new password";
          btnResend.style.display = "block";
          document.getElementById("hint").textContent =
            "Enter the code sent to " + email + " (check Spam), then your new password.";
          setMsg("If an account exists, a code was sent from Codex Hub.", "ok");
        })
        .catch(function (e) {
          btnMain.disabled = false;
          btnResend.disabled = false;
          setMsg((e && e.message) || "Failed", "err");
        });
    }

    function resetPassword() {
      var email = (emailEl.value || "").trim().toLowerCase();
      var code = codeValue();
      var p1 = document.getElementById("pass").value;
      var p2 = document.getElementById("pass2").value;
      if (code.length !== 6) { setMsg("Enter all 6 digits", "err"); return; }
      if (p1.length < 6) { setMsg("Password must be at least 6 characters", "err"); return; }
      if (p1 !== p2) { setMsg("Passwords do not match", "err"); return; }
      btnMain.disabled = true;
      setMsg("Updating password…", "info");
      fetchJson(BACKEND + "/auth/reset-password", { email: email, code: code, newPassword: p1 }, 40000, "Server timed out. Wait a few seconds and try again.")
        .then(function (x) {
          btnMain.disabled = false;
          if (!x.r.ok) throw new Error((x.j && x.j.error) || "Reset failed");
          setMsg("Password updated. Opening login…", "ok");
          setTimeout(function () { location.href = "login.html?reset=1"; }, 900);
        })
        .catch(function (e) {
          btnMain.disabled = false;
          setMsg((e && e.message) || "Failed", "err");
        });
    }

    btnMain.onclick = function () {
      if (phase === "email") sendCode();
      else resetPassword();
    };
    btnResend.onclick = sendCode;
  })();
  </script>
</body>
</html>
