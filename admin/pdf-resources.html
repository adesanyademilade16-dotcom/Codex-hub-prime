<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource Manager · Codex Hub Admin</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/resources.css"><style>body{margin:0;background:#F5F7FB;color:#0F172A;font-family:"Plus Jakarta Sans",system-ui,sans-serif}.top{position:sticky;top:0;z-index:30;background:#0F172A;color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.top a{color:#E0E7FF;text-decoration:none;font-size:.76rem;font-weight:700}.wrap{max-width:1180px;margin:auto;padding:18px 14px 50px}.head{display:flex;justify-content:space-between;gap:12px;align-items:end}.head h1{margin:3px 0;font-size:1.45rem}.head p{margin:0;color:#64748B;font-size:.78rem}.btn{border:0;border-radius:10px;padding:9px 12px;font:800 .7rem system-ui;cursor:pointer}.primary{background:#4F46E5;color:#fff}.ghost{background:#fff;border:1px solid #E2E8F0;color:#334155}.danger{background:#FEF2F2;color:#B91C1C}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.stat{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:12px}.stat b{font-size:1.25rem;color:#4F46E5}.stat span{display:block;color:#64748B;font-size:.62rem;font-weight:800;margin-top:3px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap}.tab.on{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}.section{display:none}.section.on{display:block}.table{background:#fff;border:1px solid #E2E8F0;border-radius:16px;overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:720px}.table th{background:#F8FAFC;color:#64748B;text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;padding:10px;border-bottom:1px solid #E2E8F0}.table td{padding:10px;border-bottom:1px solid #F1F5F9;font-size:.72rem;vertical-align:middle}.thumb{width:44px;height:58px;object-fit:cover;border-radius:6px;background:#EEF2FF}.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.5);padding:12px;align-items:center;justify-content:center}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.sheet h2{font-size:1rem;margin:0 0 12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:.64rem;font-weight:800;color:#64748B;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #DDE3EC;border-radius:10px;font:500 .75rem system-ui}.field textarea{min-height:80px}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.filebox{border:1.5px dashed #C7D2FE;background:#F8FAFF;border-radius:14px;padding:18px;text-align:center;cursor:pointer}.filebox strong{font-size:.75rem}.preview{display:none;width:100%;max-height:210px;object-fit:contain;border-radius:12px;background:#F1F5F9;margin-top:8px}.empty{text-align:center;padding:38px;color:#94A3B8;font-size:.8rem}.note{font-size:.65rem;color:#94A3B8;margin-top:5px}.report{padding:12px;border:1px solid #E2E8F0;border-radius:12px;background:#fff;margin-bottom:8px}.status{font-size:.7rem;color:#64748B;margin-top:7px}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start}} </style></head><body><div class="top"><strong>Codex Hub · Resource Manager</strong><a href="../app/resources.html">Student library</a></div><main class="wrap"><header class="head"><div><div style="font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6366F1">Study resources</div><h1>Resource Manager</h1><p>Review student contributions and manage admin resources from one place.</p></div><button class="btn primary" id="uploadBtn">+ Upload resource</button></header><div class="stats"><div class="stat"><b id="sPending">0</b><span>Pending review</span></div><div class="stat"><b id="sVerified">0</b><span>Verified / approved</span></div><div class="stat"><b id="sReports">0</b><span>Open reports</span></div><div class="stat"><b id="sLegacy">0</b><span>Legacy resources</span></div></div><div class="tabs"><button class="btn ghost tab on" data-tab="pending">Pending</button><button class="btn ghost tab" data-tab="approved">Approved</button><button class="btn ghost tab" data-tab="legacy">Legacy</button><button class="btn ghost tab" data-tab="reports">Reports</button></div><section class="section on" id="pending"><div class="table" id="pendingTable"></div></section><section class="section" id="approved"><div class="table" id="approvedTable"></div></section><section class="section" id="legacy"><div class="table" id="legacyTable"></div></section><section class="section" id="reports"><div id="reportList"></div></section></main>
<div class="modal" id="editor"><div class="sheet"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 id="editorTitle">Upload resource</h2><button class="btn ghost" id="closeEditor">Close</button></div><div id="editorBody"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../js/firestore-boot.js"></script><script src="../js/firebase-config.js"></script><script src="../js/app-auth.js"></script><script src="../js/media.js"></script><script src="../js/resources-core.js"></script><script>(function(){if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);var $=id=>document.getElementById(id),pending=[],approved=[],legacy=[],reports=[],editing=null;function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}function bytes(n){return CodexResources.formatBytes?CodexResources.formatBytes(n):String(n||0)}function open(){
$("editor").classList.add('open')}function close(){$("editor").classList.remove('open');editing=null}function table(rows,mode){if(!rows.length)return '<div class="empty">Nothing here yet.</div>';return '<table><thead><tr><th>Preview</th><th>Resource</th><th>Course</th><th>Uploader</th><th>Tier</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+(r.thumbnailUrl?'<img class="thumb" src="'+esc(r.thumbnailUrl)+'" alt="">':'—')+'</td><td><strong>'+esc(r.title||'Untitled')+'</strong><div style="color:#94A3B8;margin-top:3px">'+bytes(r.fileSize)+' · '+(r.pageCount||'—')+' pages</div></td><td>'+esc(r.courseCode||r.courseTitle||'')+'</td><td>'+esc(r.uploaderName||'Codex Admin')+'</td><td>'+esc(r.accessTier||'free')+'</td><td>'+esc(r.status||'approved')+'</td><td><button class="btn primary" data-edit="'+r.id+'" data-source="'+(r.source||'resources')+'">Manage</button></td></tr>').join('')+'</tbody></table>'}async function load(){try{pending=await CodexResources.listPendingForAdmin()}catch(e){pending=[]}try{reports=await CodexResources.listReportsPending()}catch(e){reports=[]}try{legacy=await CodexResources.listLegacyPdfsForAdmin()}catch(e){legacy=[]}try{var s=await firebase.firestore().collection('resources').where('status','==','approved').limit(120).get();approved=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){approved=[]}$("sPending").textContent=pending.length;$("sVerified").textContent=approved.length;$("sReports").textContent=reports.length;$("sLegacy").textContent=legacy.length;$("pendingTable").innerHTML=table(pending,'pending');$("approvedTable").innerHTML=table(approved,'approved');$("legacyTable").innerHTML=table(legacy,'legacy');$("reportList").innerHTML=reports.length?reports.map(r=>'<div class="report"><strong>'+esc(r.reason||'Report')+'</strong><div style="color:#64748B;margin-top:4px;font-size:.68rem">Resource: '+esc(r.resourceId||'')+(r.note?' · '+esc(r.note):'')+'</div></div>').join(''):'<div class="empty">No open reports.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>manage(b.dataset.edit,b.dataset.source));}
function uploadForm(){$("editorTitle").textContent='Upload resource';$("editorBody").innerHTML='<div class="formgrid"><div class="field full"><label>File</label><div class="filebox" id="filebox"><strong>Choose PDF / DOC / DOCX</strong><input id="file" type="file" accept=".pdf,.doc,.docx" hidden></div><img id="pdfPreview" class="preview" alt="First page preview"></div><div class="field"><label>Title</label><input id="rTitle"></div><div class="field"><label>Course code</label><input id="rCode"></div><div class="field"><label>Course title</label><input id="rCourseTitle"></div><div class="field"><label>Category</label><select id="rCategory">'+CodexResources.CATEGORIES.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select></div><div class="field"><label>Level</label><select id="rLevel"><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option></select></div><div class="field"><label>Semester</label><select id="rSem"><option>1st</option><option>2nd</option></select></div><div class="field"><label>Access tier</label><select id="rTier"><option value="free">Free</option><option value="regular">Regular</option><option value="pro">Pro</option></select></div><div class="field full"><label>Description</label><textarea id="rDesc"></textarea></div></div><div class="actions"><button class="btn ghost" id="cancelUpload">Cancel</button><button class="btn primary" id="publishUpload">Publish resource</button></div><div class="status" id="uploadStatus">Admin uploads can be Free, Regular or Pro.</div>';var file=null;$("filebox").onclick=()=>$("file").click();$("file").onchange=()=>{file=$("file").files[0];if(file)$("filebox").querySelector('strong').textContent=file.name};$("cancelUpload").onclick=close;$("publishUpload").onclick=async()=>{if(!file){$("uploadStatus").textContent='Choose a file first.';return}$("uploadStatus").textContent='Uploading…';try{var up=await CodexResources.uploadResourceFile(file),pc=0,thumb='';if(CodexResources.fileExt(file.name)==='pdf'){try{var t=await CodexResources.renderPdfThumbnail(file);pc=t.pageCount;var tu=await CodexResources.uploadThumbnailBlob(t.blob);thumb=tu.url}catch(e){}}await CodexResources.createAdminResource({title:$("rTitle").value,description:$("rDesc").value,courseCode:$("rCode").value,courseTitle:$("rCourseTitle").value,category:$("rCategory").value,level:$("rLevel").value,semester:$("rSem").value,accessTier:$("rTier").value,verified:true,featured:false},{fileType:CodexResources.fileExt(file.name),mimeType:file.type,fileSize:file.size,pageCount:pc,fileUrl:up.url,publicId:up.publicId,thumbnailUrl:thumb});close();await load()}catch(e){$("uploadStatus").textContent=e.message||'Upload failed'}}}
async function manage(id,source){var r=source==='legacy'?legacy.find(x=>x.id===id):[...pending,...approved].find(x=>x.id===id);if(!r){try{r=await CodexResources.getResource(id)}catch(e){}}if(!r)return;$("editorTitle").textContent='Manage resource';$("editorBody").innerHTML='<div style="display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start"><div>'+(r.thumbnailUrl?'<img src="'+esc(r.thumbnailUrl)+'" style="width:100%;border-radius:10px">':'<div style="height:180px;border-radius:10px;background:#EEF2FF;display:grid;place-items:center;color:#94A3B8">No preview</div>')+'</div><div><h3 style="margin:0 0 5px;font-size:.95rem">'+esc(r.title||'Untitled')+'</h3><p style="margin:0;color:#64748B;font-size:.72rem">'+esc(r.courseCode||'')+' · '+esc(r.uploaderName||'')+' · '+bytes(r.fileSize)+'</p></div></div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Access tier</label><select id="mTier"><option value="free">Free</option><option value="regular">Regular</option><option value="pro">Pro</option></select></div><div class="field"><label>Status</label><select id="mAction"><option value="approve">Approve / publish</option><option value="hide">Hide</option><option value="correction">Request correction</option><option value="reject">Reject</option></select></div><div class="field full"><label>Review message</label><textarea id="mMsg" placeholder="Optional note to the student"></textarea></div></div><div class="actions"><button class="btn ghost" id="mClose">Cancel</button><button class="btn primary" id="mSave">Save changes</button><button class="btn danger" id="mDelete">Delete</button></div><div class="status" id="mStatus"></div>';$("mTier").value=r.accessTier||'free';open();$("mClose").onclick=close;$("mDelete").onclick=async()=>{if(!confirm('Delete this resource permanently?'))return;await CodexResources.deleteResourcePermanent(id,source);close();load()};$("mSave").onclick=async()=>{var act=$("mAction").value;$("mStatus").textContent='Saving…';try{if(source==='legacy'){await CodexResources.updateLegacyAccess(id,{accessTier:$("mTier").value,status:act==='approve'?'approved':act==='hide'?'hidden':'rejected'});}else{await CodexResources.moderateResource(id,act,{accessTier:$("mTier").value,verified:true,featured:false,message:$("mMsg").value})}close();await load()}catch(e){$("mStatus").textContent=e.message||'Save failed'}};open()}
$("uploadBtn").onclick=()=>{open();uploadForm()};$("closeEditor").onclick=close;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.tab).classList.add('on')});firebase.auth().onAuthStateChanged(async u=>{if(!u||!CodexResources.isAdminEmail(u.email)){document.body.innerHTML='<div style="padding:40px;font-family:system-ui">Admin only.</div>';return}await load()});})();</script></body></html>
