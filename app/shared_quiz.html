<!doctype html>
<html lang="en">
<head>
  <script src="../js/theme-boot.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared quiz · Codex Hub</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Codex Hub">
<meta property="og:title" content="Codex Hub — Shared quiz">
<meta property="og:description" content="Try this study quiz on Codex Hub — CBT practice for university students.">
<meta property="og:image" content="https://codex-hub-prime.vercel.app/assets/og-quiz.jpg">
<meta property="og:url" content="https://codex-hub-prime.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Codex Hub — Shared quiz">
<meta name="twitter:image" content="https://codex-hub-prime.vercel.app/assets/og-quiz.jpg">
<meta name="theme-color" content="#4F46E5">
<link rel="icon" href="../assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --accent:#4F46E5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:#F8FAFC; color:var(--ink); min-height:100dvh; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 40px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:20px; text-decoration:none; color:inherit; }
  .brand img { width:36px; height:36px; border-radius:10px; }
  .brand b { font-size:1rem; }
  .card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:0 10px 30px rgba(15,23,42,.06); }
  h1 { margin:0 0 6px; font-size:1.25rem; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .opt { display:block; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; margin:8px 0; cursor:pointer; }
  .opt:has(input:checked) { border-color:#818CF8; background:#EEF2FF; }
  .nav { display:flex; gap:10px; margin-top:16px; }
  .nav button { flex:1; height:48px; border:0; border-radius:14px; font-weight:800; font-family:inherit; cursor:pointer; }
  .pri { background:linear-gradient(135deg,#4F46E5,#7C3AED); color:#fff; }
  .sec { background:#F1F5F9; color:#334155; }
  .start { text-align:center; }
  .start .big { font-size:2rem; font-weight:800; color:var(--accent); margin:8px 0; }
  .err { color:#DC2626; padding:20px; text-align:center; }
</style>

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="../index.html"><img src="../assets/logo.png" alt=""><b>Codex Hub</b></a>
    <div class="card" id="root"><p class="meta">Loading quiz…</p></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="../js/firestore-boot.js"></script>
  <script src="../js/firebase-config.js"></script>
    <script>
    var root = document.getElementById("root");
    var id = new URLSearchParams(location.search).get("id");
    if (!id) {
      var parts = (location.pathname || "").split("/").filter(Boolean);
      var qi = parts.indexOf("q");
      if (qi >= 0 && parts[qi + 1]) id = decodeURIComponent(parts[qi + 1]);
      // also support /app/shared_quiz.html leftover path segment
      if (!id && parts.length) {
        var last = parts[parts.length - 1];
        if (last && last !== "shared_quiz.html" && last !== "q" && last !== "app") id = decodeURIComponent(last);
      }
    }
    if (!id) { root.innerHTML = '<p class="err">Missing quiz link.</p>'; }
    else {
    var db = firebase.firestore();
    var quiz = [], title = "Shared quiz", idx = 0, answers = {};
    function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function paintStart(){
      root.innerHTML = '<div class="start"><p class="meta">Shared quiz</p><h1>'+esc(title)+'</h1>'+
        '<p class="meta">'+quiz.length+' questions</p>'+
        '<button class="pri" style="width:100%;height:52px;border:0;border-radius:14px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:12px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff" id="go">Start</button></div>';
      document.getElementById("go").onclick = function(){ idx=0; answers={}; paintQ(); };
    }
    function paintQ(){
      var item = quiz[idx];
      if (!item) { root.innerHTML = '<p class="err">No questions in this quiz.</p>'; return; }
      root.innerHTML = '<p class="meta">Question '+(idx+1)+' / '+quiz.length+'</p><h1 style="font-size:1.05rem">'+esc(item.q)+'</h1>'+
        (item.options||[]).map(function(o,i){
          var c = answers[idx]===i?' checked':'';
          return '<label class="opt"><input type="radio" name="q" value="'+i+'"'+c+'> '+esc(o)+'</label>';
        }).join("")+
        '<div class="nav"><button class="sec" id="back"'+(idx===0?' disabled':'')+'>Back</button>'+
        (idx<quiz.length-1?'<button class="pri" id="next">Next</button>':'<button class="pri" id="fin">Finish</button>')+'</div>';
      root.querySelectorAll('input[name=q]').forEach(function(inp){ inp.onchange=function(){ answers[idx]=+inp.value; }; });
      var b=document.getElementById("back"); if(b) b.onclick=function(){idx--;paintQ();};
      var n=document.getElementById("next"); if(n) n.onclick=function(){var s=root.querySelector('input:checked');if(s)answers[idx]=+s.value;idx++;paintQ();};
      var f=document.getElementById("fin"); if(f) f.onclick=function(){
        var s=root.querySelector('input:checked');if(s)answers[idx]=+s.value;
        var correct=0;
        quiz.forEach(function(q,i){ if(typeof q.answer==='number' && answers[i]===q.answer) correct++; });
        root.innerHTML = '<div class="start"><h1>Done</h1><p class="big">'+correct+' / '+quiz.length+'</p>'+
          '<button class="pri" style="width:100%;height:48px;border:0;border-radius:14px;font-weight:800;margin-top:12px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff" id="retry">Retry</button></div>';
        document.getElementById("retry").onclick=function(){paintStart();};
      };
    }
    var loadTimer = setTimeout(function(){
      if (root && /Loading quiz/i.test(root.textContent||"")) {
        root.innerHTML = '<p class="err">Still loading…</p><p class="meta">Firestore is slow or blocked on this network (same issue as login). Try VPN / other network, then Retry.</p>'+
          '<button class="pri" style="width:100%;height:48px;border:0;border-radius:14px;font-weight:800;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff" id="quizRetry">Retry</button>';
        var rb=document.getElementById("quizRetry"); if(rb) rb.onclick=function(){ location.reload(); };
      }
    }, 10000);
    db.collection("shared_quizzes").doc(id).get().then(function(snap){
      clearTimeout(loadTimer);
      if(!snap.exists){ root.innerHTML='<p class="err">This quiz link is invalid or was removed.</p>'; return; }
      var data = snap.data() || {};
      title = data.title || title;
      quiz = Array.isArray(data.questions) ? data.questions : [];
      if (!quiz.length) { root.innerHTML='<p class="err">This quiz has no questions.</p>'; return; }
      try{ db.collection("shared_quizzes").doc(id).update({views:firebase.firestore.FieldValue.increment(1)}); }catch(e){}
      paintStart();
    }).catch(function(err){
      clearTimeout(loadTimer);
      root.innerHTML = '<p class="err">Could not load quiz.</p><p class="meta">'+(err&&err.message?esc(err.message):'network')+'</p>'+
        '<button class="pri" style="width:100%;height:48px;border:0;border-radius:14px;font-weight:800;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff" id="quizRetry2">Retry</button>';
      var r2=document.getElementById("quizRetry2"); if(r2) r2.onclick=function(){ location.reload(); };
    });
    }
  </script>

</body>
</html>
