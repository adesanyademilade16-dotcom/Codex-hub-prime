    /* MathJax for Study Lab notes: $x$ and \(x\) inline, $x$ and \[x\] display.
       Built with String.fromCharCode(92) so the delimiters never depend on how
       this file's escaping survives an upload. */
    (function () {
      var bs = String.fromCharCode(92);
      var dl = String.fromCharCode(36) + String.fromCharCode(36);
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], [bs + "(", bs + ")"]],
          displayMath: [[dl, dl], [bs + "[", bs + "]"]]
        },
        svg: { fontCache: "global" }
      };
    })();
  </script>

  <style>
    :root {

      display: grid; place-items: center; text-decoration: none; color: var(--ink); font-weight: 700;

    .head h1 { margin: 0; font-size: 1.05rem; font-weight: 800; flex: 1; line-height: 1.25; }

      border: 0; background: #fff; border: 1px solid var(--line); border-radius: 999px;

    .panel { display: none; }

    /* Flashcards */
    .fc-stage {
      perspective: 1000px; margin: 0 auto 14px; max-width: 400px; width: 100%;
    }
    .fc {
      height: min(52vh, 320px); min-height: 200px; border-radius: 20px; position: relative;
      transform-style: preserve-3d; transition: transform .5s cubic-bezier(.22,1,.36,1);
      cursor: pointer; box-shadow: 0 12px 32px rgba(79,70,229,.15);
      width: 100%;
    }
    .fc.flipped { transform: rotateY(180deg); }
    .fc .face {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      padding: 18px 16px; text-align: center;
      font-size: clamp(0.85rem, 2.8vw, 1.05rem); font-weight: 700; line-height: 1.45;
      overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      word-break: break-word; overflow-wrap: anywhere; box-sizing: border-box;
    }
    .fc .front { background: linear-gradient(145deg, #4F46E5, #7C3AED); color: #fff; }
    .fc .back {
      background: #fff; color: var(--ink); border: 1px solid var(--line);
      transform: rotateY(180deg); font-weight: 600;
      font-size: clamp(0.8rem, 2.6vw, 0.95rem);

    /* Long titles never blow the mobile layout */

      font-size: clamp(0.95rem, 4vw, 1.15rem);

      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

    .q-card p, .q-card label {

    .fc-nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }

      .note-sheet, .summary-paper {

    .tool-bar {

  <script>
  (function () {
    "use strict";
    var params = new URLSearchParams(location.search);
    var docId = params.get("id");
    var user, db, profile = {}, docData = null;
    var cardIndex = 0;
    var cards = [];

    function formatNotes(raw) {
      var s = escape(String(raw || ""));
      // Convert GitHub-style Markdown tables before paragraph/line-break formatting.
      // Input is HTML-escaped first, and every cell remains escaped.
      s = renderMarkdownTables(s);
      // headings
      s = s.replace(/^### (.+)$/gm, '<h4 style="margin:14px 0 6px;font-size:1rem;color:#1E3A8A">$1</h4>');
      s = s.replace(/^## (.+)$/gm, '<h3 style="margin:16px 0 8px;font-size:1.1rem;color:#1E3A8A">$1</h3>');
      s = s.replace(/^# (.+)$/gm, '<h2 style="margin:18px 0 10px;font-size:1.2rem;color:#0F172A">$1</h2>');
      // bold + italic
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|\s)\*([^*]+)\*(?=\s|$)/g, "$1<em>$2</em>");
      // bullet lines
      s = s.replace(/^\s*[-*] (.+)$/gm, '<div style="padding-left:12px;margin:4px 0">• $1</div>');
      s = s.replace(/^\s*\d+\. (.+)$/gm, '<div style="padding-left:12px;margin:4px 0">$1</div>');
      // paragraphs
      s = s.replace(/\n\n/g, "</p><p style=\"margin:8px 0;line-height:1.55\">");
      s = s.replace(/\n/g, "<br>");
      return '<p style="margin:0;line-height:1.55">' + s + "</p>";
    }
    function escape(s) {
      return String(s || "").replace(/[&<>"']/g, function (m) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m];
      });
    }
    function renderMarkdownTables(source) {
      var lines = String(source || "").split("\n");
      var out = [];
      function cells(line) {
        return String(line || "").trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (v) { return v.trim(); });
      }
      function inlineCell(v) {
        return String(v || "").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }
      for (var i = 0; i < lines.length; i++) {
        var header = lines[i];
        var separator = lines[i + 1] || "";
        if (header.indexOf("|") !== -1 && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(separator)) {
          var heads = cells(header);
          var table = '<div class="study-table-wrap"><table class="study-md-table"><thead><tr>';
          heads.forEach(function (h) { table += "<th>" + inlineCell(h) + "</th>"; });
          table += "</tr></thead><tbody>";
          i += 2;
          while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim()) {
            var row = cells(lines[i]);
            table += "<tr>";
            for (var c = 0; c < heads.length; c++) table += "<td>" + inlineCell(row[c] || "") + "</td>";
            table += "</tr>";
            i++;
          }
          table += "</tbody></table></div>";
          out.push(table);
          i--;
        } else out.push(lines[i]);
      }
      return out.join("\n");
    }

    document.querySelectorAll(".tabs button").forEach(function (btn) {
      btn.onclick = function () {
        document.querySelectorAll(".tabs button").forEach(function (b) { b.classList.remove("on"); });
        document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("on"); });
        btn.classList.add("on");
        document.getElementById("panel-" + btn.getAttribute("data-tab")).classList.add("on");
      };
    });

    
    var NOVA_API = "https://codex-backend-new.onrender.com/chat";
    /* The whole document, not just its opening pages. A long PDF was cut at ~28k
       characters from the start, so the model only ever saw the first chapters and
       never asked about the rest. This samples head, evenly spaced middle slices and
       the tail, each labelled, so the AI reads the entire file end to end. */
    function sourceBlob(doc) {
      var t = String((doc && (doc.extractedText || doc.sourceText || doc.textContent || "")) || "").trim();
      if (!t) return "";
      var BUDGET = 30000;
      if (t.length <= BUDGET) return t;
      var parts = 6;
      var size = Math.floor(BUDGET / parts);
      var chunks = [];
      for (var i = 0; i < parts; i++) {
        var start = Math.round((t.length - size) * (i / (parts - 1)));

    function notePages(text) {
      var parts = String(text || "").split(/\n\n+/);
      var pages = [], buf = "";
      parts.forEach(function (p) {
        if ((buf + "\n\n" + p).length > 900 && buf) { pages.push(buf); buf = p; }
        else buf = buf ? buf + "\n\n" + p : p;
      });
      if (buf) pages.push(buf);
      return pages.length ? pages : [text || ""];
    }
    var notePageIdx = 0;
    function bindNoteActions(text) {
      var pages = notePages(text);
      notePageIdx = 0;
      function paintPage() {
        var sheet = document.getElementById("sumText");
        if (!sheet) return;
        sheet.classList.remove("flip-in");
        void sheet.offsetWidth;
        sheet.classList.add("flip-in");
        sheet.innerHTML = formatNotes(pages[notePageIdx] || "");
        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise([sheet]).catch(function () {});
        }
        var nav = document.getElementById("pageNav");
        if (nav) {
          nav.style.display = pages.length > 1 ? "flex" : "none";
          var lab = document.getElementById("pageLab");
          if (lab) lab.textContent = "Page " + (notePageIdx + 1) + " / " + pages.length;
        }
      }
      var copy = document.getElementById("noteCopy");
      var share = document.getElementById("noteShare");
      var dl = document.getElementById("noteDl");
      var sp = document.getElementById("noteSpeak");
      var ask = document.getElementById("noteNova");
      if (copy) copy.onclick = function () {
        if (navigator.clipboard) navigator.clipboard.writeText(text);
        copy.style.transform = "scale(1.12)";
        setTimeout(function () { copy.style.transform = ""; }, 180);
      };
      if (share) share.onclick = function () {
        var title = (docData && docData.title) || "Codex notes";
        var snippet = text.slice(0, 1500);
        var sheet = document.getElementById("notesShareSheet");
        if (!sheet) {
          // fallback
          window.open("https://wa.me/?text=" + encodeURIComponent("📝 " + title + "\n\n" + snippet), "_blank");
          return;
        }
        sheet.hidden = false;
        function close() { sheet.hidden = true; }
        document.getElementById("nsCancel").onclick = close;
        sheet.onclick = function (e) { if (e.target === sheet) close(); };
        document.getElementById("nsWa").onclick = function () {
          window.open("https://wa.me/?text=" + encodeURIComponent("📝 " + title + " — Codex Hub\n\n" + snippet), "_blank");
          close();
        };
        document.getElementById("nsSys").onclick = function () {
          if (navigator.share) {
            navigator.share({ title: title, text: snippet }).catch(function () {});
          } else {
            window.open("https://wa.me/?text=" + encodeURIComponent(snippet), "_blank");
          }
          close();
        };
        document.getElementById("nsCopy").onclick = function () {
          if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () {
            alert("Notes copied");
          });
          close();
        };
        document.getElementById("nsDl").onclick = function () {
          doDownloadNotes();
          close();
        };
      };
      function doDownloadNotes() {
        try {
          var title = (docData && (docData.title || docData.fileName)) || "Codex notes";
          var safe = String(title).replace(/[^\w\-]+/g, "_").slice(0, 40) || "notes";
          var style = "body{font-family:Georgia,serif;max-width:720px;margin:24px auto;padding:20px;line-height:1.65;color:#0F172A;background:#F8FAFC}"
            + "h1{font-family:system-ui,sans-serif;color:#4F46E5;font-size:1.25rem;word-break:break-word;overflow-wrap:anywhere;line-height:1.3}"
            + ".meta{color:#64748B;font-size:.85rem;margin-bottom:20px}"
            + ".sheet{background:#fff;border-radius:16px;padding:20px;border:1px solid #E2E8F0}";
          var html = "<!doctype html><html><head><meta charset=utf-8>"
            + "<meta name=viewport content=\"width=device-width,initial-scale=1\">"
            + "<title>" + escape(title) + "</title><style>" + style + "</style></head><body>"
            + "<h1>" + escape(title) + "</h1>"
            + "<p class=meta>Exported from Codex Hub Study Lab</p>"
            + "<div class=sheet>" + formatNotes(text) + "</div></body></html>";
          var blob = new Blob([html], { type: "text/html;charset=utf-8" });
          var fileName = safe + "_notes.html";
          var file = new File([blob], fileName, { type: "text/html" });
          function anchorDl() {
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
          }
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: title, text: "Codex Hub notes" }).catch(anchorDl);
          } else {
            anchorDl();
          }
          var toast = document.createElement("div");
          toast.className = "toast-dl";
          toast.textContent = "Notes ready — use the share sheet or check Downloads";
          document.body.appendChild(toast);
          setTimeout(function () { toast.remove(); }, 3200);
        } catch (err) {
          alert("Download failed: " + (err.message || err));
        }
      }
      if (dl) dl.onclick = doDownloadNotes;
      if (sp) sp.onclick = function () {
        try {
          if (typeof window.SpeechSynthesisUtterance === "undefined" || !window.speechSynthesis) {
            alert("Read-aloud is not available in this browser. Try Chrome or open via https.");
            return;
          }
          if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
          var u = new SpeechSynthesisUtterance(pages[notePageIdx] || text);
          u.rate = 0.95;
          speechSynthesis.speak(u);
        } catch (err) {
          alert("Could not start read-aloud.");
        }
      };
      if (ask) ask.onclick = function () {
        try { sessionStorage.setItem("nova_prefill", "Explain these Study Lab notes in simple steps:\n\n" + text.slice(0, 3500)); } catch (e) {}
        location.href = "nova.html";
      };
      var prev = document.getElementById("pagePrev");
      var next = document.getElementById("pageNext");
      if (prev) prev.onclick = function () { notePageIdx = (notePageIdx - 1 + pages.length) % pages.length; paintPage(); };
      if (next) next.onclick = function () { notePageIdx = (notePageIdx + 1) % pages.length; paintPage(); };
      paintPage();
    }
    function renderSummary() {
      var box = document.getElementById("sumBox");
      var sum = loadSummary(docData || "");
      if (!sum) {
        box.innerHTML =
          '<div class="empty"><strong>No summary yet</strong>Generate a short outline from the document title. Deep PDF summarisation uses your existing Study Lab pipeline when wired.</div>' +
          '<button type="button" class="gen" id="genSum">Generate summary with AI</button>';
        document.getElementById("genSum").onclick = function () {
          var topic = docData.title || docData.fileName || "Document";
          var src = sourceBlob(docData);
          var btn = document.getElementById("genSum");
          if (btn) { btn.disabled = true; btn.textContent = "Writing summary…"; }
          var prompt =
            "Write a clear study summary/notes for university students on: " + topic + ".\n" +
            (src
              ? "SOURCE TEXT (base the summary on this):\n" + src + "\n\n"
              : "No source text extracted — produce a structured syllabus-style outline for the topic.\n\n") +
            "Use headings and bullet points. Include: core ideas, key terms with short definitions, " +
            "important formulas/facts if any, common mistakes, and a short revision checklist. " +
            "Plain text/markdown only — no JSON.";
          callStudyAI(prompt, "Write complete study notes, not placeholders.")
            .then(function (raw) {
              var text = String(raw || "").trim();
              if (text.length < 40) throw new Error("Summary too short");
              docData.summary = text;
              saveArtifacts();
              renderSummary();
            })
            .catch(function (err) {
              console.warn(err);
              alert((err && err.message) || "Summary generation failed.");
              if (btn) { btn.disabled = false; btn.textContent = "Generate summary with AI"; }
            });
        };
        return;
      }
      box.innerHTML =
        '<div class="note-sheet summary-paper" id="sumText"></div>' +
        '<div class="page-nav" id="pageNav" style="display:none">' +
          '<button type="button" id="pagePrev">← Prev page</button>' +
          '<span id="pageLab" style="font-size:.75rem;font-weight:700;color:#64748B"></span>' +
          '<button type="button" id="pageNext">Next page →</button></div>' +
        '<div class="tool-bar">' +
          iconBtn("copy","noteCopy",ICO.copy,"Copy") +
          iconBtn("share","noteShare",ICO.share,"Share") +
          iconBtn("dl","noteDl",ICO.dl,"Download") +
          iconBtn("speak","noteSpeak",ICO.mic,"Read") +
          iconBtn("nova","noteNova",ICO.nova,"Ask Nova") +
        "</div>";
      bindNoteActions(sum);
    }

    function renderFile() {
      var box = document.getElementById("fileBox");
      if (!docData) return;
      box.innerHTML =
        '<div class="q-card">' +
          "<p><strong>" + escape(docData.fileName || docData.title || "File") + "</strong></p>" +
          (docData.fileUrl
            ? '<p><a href="' + escape(docData.fileUrl) + '" target="_blank" rel="noopener" style="color:#4F46E5;font-weight:700">Open source file →</a></p>'
            : "<p style=\"color:#64748B\">No file URL stored for this folder.</p>") +
        "</div>";
    }

    function saveArtifacts() {
      if (!docId || !user) return;
      var quizArr = docData.quiz || loadQuiz(docData) || [];
      var sumText = docData.summary || loadSummary(docData) || "";
      db.collection("study_lab_documents").doc(docId).set({
        flashcards: cards,
        quiz: quizArr,
        summary: sumText,
        outputs: {
          flashcards: JSON.stringify(cards),
          quiz: JSON.stringify(quizArr),
          summary: sumText
        },
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(function (err) { console.warn(err); });
    }


    function parseMaybeJson(val) {
      if (val == null) return null;
      if (typeof val === "string") {
        try { return JSON.parse(val); } catch (e) { return null; }
      }
      return val;
    }
    function loadFlashcards(data) {
      var raw = null;
      if (Array.isArray(data.flashcards)) raw = data.flashcards;
      else if (Array.isArray(data.cards)) raw = data.cards;
      else if (data.outputs) {
        raw = parseMaybeJson(data.outputs.flashcards);
      }
      if (!Array.isArray(raw)) return [];
      return raw.map(function (c) {
        if (typeof c === "string") return { q: c, a: "" };
        return {
          q: c.q || c.front || c.question || c.prompt || "",
          a: c.a || c.back || c.answer || c.response || ""
        };
      }).filter(function (c) { return c.q; });
    }
    function loadQuiz(data) {
      var raw = null;
      if (Array.isArray(data.quiz)) raw = data.quiz;
      else if (Array.isArray(data.questions)) raw = data.questions;
      else if (data.outputs) {
        raw = parseMaybeJson(data.outputs.quiz);
      }
      if (!Array.isArray(raw)) return [];
      return raw.map(function (item) {
        var q = item.q || item.question || "";
        var options = item.options || item.choices || [];
        if (!Array.isArray(options)) options = [];
        options = options.map(function (o) { return String(o).replace(/^[A-D][\.\)]\s*/i, "").trim(); });
        var ans = item.ans;
        if (ans == null && item.answer != null) {
          var answerStr = String(item.answer).replace(/^[A-D][\.\)]\s*/i, "").trim();
          ans = options.findIndex(function (o) {
            return o.toLowerCase() === answerStr.toLowerCase();
          });
          if (ans < 0) ans = 0;
        }
        if (typeof ans !== "number") ans = 0;
        return { q: q, options: options, ans: ans };
      }).filter(function (item) { return item.q && item.options.length; });
    }
    /* Older saves stored the model's whole HTTP envelope
       ({"id":"chatcmpl-...","choices":[...]}) instead of the prose inside it, which
       is what printed as raw JSON in the Summary tab. Unwrap it on read so existing
       documents heal themselves, not only newly generated ones. */
    function unwrapAIEnvelope(raw) {
      var s = String(raw == null ? "" : raw).trim();
      if (!s) return "";
      // Up to three layers: some older saves stringified the envelope twice.
      for (var pass = 0; pass < 3; pass++) {
        var looksWrapped = /^[[{]/.test(s) && /"choices"\s*:|"chat\.completion"|"message"\s*:/.test(s);
        if (!looksWrapped) break;
        var parsed = parseJsonBlock(s);
        var next = "";
        if (parsed && !Array.isArray(parsed)) {
          var c = parsed.choices && parsed.choices[0] && parsed.choices[0].message && parsed.choices[0].message.content;
          var keys = [c, parsed.content, parsed.summary, parsed.text, parsed.reply, parsed.answer, parsed.notes];
          for (var i = 0; i < keys.length; i++) {
            if (typeof keys[i] === "string" && keys[i].trim()) { next = keys[i].trim(); break; }
          }
        }
        if (!next) {
          var m = s.match(/"content"\s*:\s*"((?:[^"\\]|\\.)*)"/);
          if (m) { try { next = JSON.parse('"' + m[1] + '"'); } catch (e) {} }
        }
        if (!next || next === s) break;
        s = next.trim();
      }
      return s;
    }

    function loadSummary(data) {
      if (data.summary) return unwrapAIEnvelope(data.summary);
      if (data.outputs) {
        if (data.outputs.summary) return unwrapAIEnvelope(data.outputs.summary);
        if (data.outputs.notes) return unwrapAIEnvelope(data.outputs.notes);
        if (Array.isArray(data.outputs.keyPoints)) {
          return data.outputs.keyPoints.map(function (k, i) { return (i + 1) + ". " + k; }).join("\n");
        }
      }
      return "";
    }

    function paint() {
      (function () {
        var rawT = docData.title || docData.fileName || "Document";
        var tEl = document.getElementById("title");
        tEl.textContent = rawT;
        tEl.title = rawT; // full name on long-press / hover
      })();
      document.getElementById("meta").textContent =
        [docData.courseCode || docData.detectedSubject, docData.fileName].filter(Boolean).join(" · ") || "Study Lab folder";
      cards = loadFlashcards(docData);
      cardIndex = 0;
      renderCards();
      renderQuiz();
      renderSummary();
      renderFile();
    }

    CodexShell.mountShell({ page: "ai", title: "Study Lab", user: { fullName: "Student" } });
    CodexAuth.requireUser().then(function (res) {
      user = res.user;
      db = res.db;
      profile = res.profile || {};
      CodexShell.mountShell({
        page: "ai",
        title: "Study Lab",
        profile: profile,
        user: { fullName: profile.fullName || profile.displayName || user.displayName }
      });
      if (!docId) {
        location.href = "study-lab.html";
        return;
      }
      db.collection("study_lab_documents").doc(docId).get()
        .then(function (snap) {
          if (!snap.exists) {
            document.getElementById("title").textContent = "Not found";
            return;
          }
          docData = snap.data() || {};
          docData.id = snap.id;
          if (docData.uid && docData.uid !== user.uid) {
            document.getElementById("title").textContent = "Not found";
            return;
          }
          paint();
        })
        .catch(function (err) {
          document.getElementById("meta").textContent = err.message || "Load failed";
        });
    });
  })();
  </script>
</body>
