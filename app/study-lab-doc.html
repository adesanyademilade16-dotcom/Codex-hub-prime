<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme-boot.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Document · Study Lab</title>
  <meta name="theme-color" content="#6D28D9">
  <link rel="icon" href="../assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/shell.css">
  <style>
    :root {
      --indigo: #4F46E5; --violet: #7C3AED; --ink: #0F172A;
      --muted: #64748B; --line: #E8ECF4; --font: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body.app-body { margin: 0; font-family: var(--font); background: #F1F5F9; color: var(--ink); }
    .page { max-width: 720px; margin: 0 auto; padding: 12px 14px 32px; }
    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .head a {
      width: 40px; height: 40px; border-radius: 12px; background: #fff; border: 1px solid var(--line);
      display: grid; place-items: center; text-decoration: none; color: var(--ink); font-weight: 700;
    }
    .head h1 { margin: 0; font-size: 1.05rem; font-weight: 800; flex: 1; line-height: 1.25; }
    .meta { color: var(--muted); font-size: .8rem; margin: 0 0 16px; }

    .tabs {
      display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px;
    }
    .tabs button {
      border: 0; background: #fff; border: 1px solid var(--line); border-radius: 999px;
      padding: 8px 14px; font-weight: 700; font-size: .78rem; color: var(--muted);
      cursor: pointer; white-space: nowrap; font-family: inherit;
    }
    .tabs button.on {
      background: linear-gradient(135deg, #4F46E5, #7C3AED); color: #fff; border-color: transparent;
    }

    .panel { display: none; }
    .panel.on { display: block; }

    /* Flashcards */
    .fc-stage {
      perspective: 1000px; margin: 0 auto 14px; max-width: 400px; width: 100%;
    }
    .fc {
      height: min(52vh, 320px); min-height: 200px; border-radius: 20px; position: relative;
      transform-style: preserve-3d; transition: transform .5s cubic-bezier(.22,1,.36,1);
      cursor: pointer; box-shadow: 0 12px 32px rgba(79,70,229,.15);
      width: 100%;
    }
    .fc.flipped { transform: rotateY(180deg); }
    .fc .face {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      padding: 18px 16px; text-align: center;
      font-size: clamp(0.85rem, 2.8vw, 1.05rem); font-weight: 700; line-height: 1.45;
      overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      word-break: break-word; overflow-wrap: anywhere; box-sizing: border-box;
    }
    .fc .front { background: linear-gradient(145deg, #4F46E5, #7C3AED); color: #fff; }
    .fc .back {
      background: #fff; color: var(--ink); border: 1px solid var(--line);
      transform: rotateY(180deg); font-weight: 600;
      font-size: clamp(0.8rem, 2.6vw, 0.95rem);
    }
    /* Long titles never blow the mobile layout */
    .head h1, #title {
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: clamp(0.95rem, 4vw, 1.15rem);
    }
    .meta {
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 0.78rem;
    }
    .page { overflow-x: hidden; max-width: 100vw; }
    .q-card p, .q-card label {
      word-break: break-word; overflow-wrap: anywhere;
    }
    .fc-nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
    .fc-nav button {
      border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700;
      background: #fff; border: 1px solid var(--line); cursor: pointer; font-family: inherit;
    }
    .fc-count { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 12px; }

    /* Quiz */
    .q-card {
      background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 10px;
    }
    .q-card p { margin: 0 0 12px; font-weight: 600; }
    .q-card label {
      display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px;
      border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; font-size: .88rem;
    }
    .q-card label:has(input:checked) { border-color: #818CF8; background: #EEF2FF; }
    .quiz-nav {
      display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; margin-top: 16px;
      align-items: center;
    }
    .quiz-nav button {
      border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 800;
      font-family: inherit; cursor: pointer; font-size: .85rem;
    }
    .quiz-nav .primary {
      flex: 1; min-width: 120px;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: #fff; box-shadow: 0 8px 20px rgba(79,70,229,.28);
    }
    .quiz-nav .secondary {
      background: #F1F5F9; color: #334155; min-width: 88px;
    }
    .quiz-nav .secondary:disabled { opacity: .4; }
    .quiz-nav .ghost-btn {
      background: #fff; color: #4F46E5; border: 1.5px solid #C7D2FE; width: 100%;
    }
    .quiz-start {
      text-align: center; padding: 24px 12px; background: #fff;
      border: 1px solid var(--line); border-radius: 18px;
    }
    .quiz-start .stat {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 20px;
    }
    .quiz-start .stat div {
      background: #F8FAFC; border-radius: 14px; padding: 14px 10px;
    }
    .quiz-start .stat b { display: block; font-size: 1.4rem; color: #4F46E5; }
    .quiz-start .stat span { font-size: .72rem; color: #64748B; font-weight: 600; }
    .score-card {
      text-align: center; padding: 28px 16px; background: #fff;
      border-radius: 20px; border: 1px solid var(--line);
    }
    .score-card .pct { font-size: 2.4rem; font-weight: 800; color: #4F46E5; margin: 8px 0; }
    .share-modal {
      display: none; position: fixed; inset: 0; z-index: 120;
      background: rgba(15,23,42,.5); align-items: flex-end; justify-content: center;
    }
    .share-modal.show { display: flex; }
    .share-box {
      width: min(420px, 100%); background: #fff; border-radius: 20px 20px 0 0;
      padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }
    .share-box h3 { margin: 0 0 10px; }
    .share-box input {
      width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid #E2E8F0;
      padding: 0 12px; font: inherit; margin-bottom: 10px;
    }
    .share-box .row { display: flex; gap: 8px; }
    .share-box .row button { flex: 1; height: 46px; border: 0; border-radius: 12px; font-weight: 800; cursor: pointer; font-family: inherit; }
    .wa { background: #25D366; color: #fff; }
    .cp { background: #EEF2FF; color: #3730A3; }
    .page-nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 12px; gap: 8px;
    }
    .page-nav button {
      border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 700;
      background: #EEF2FF; color: #4338CA; cursor: pointer; font-family: inherit;
    }
    .note-sheet.flip-in { animation: pageFlip .35s ease; }
    @keyframes pageFlip {
      from { transform: rotateY(-8deg); opacity: .5; }
      to { transform: none; opacity: 1; }
    }

    /* Summary */
    .sum-card {
      background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px;
      line-height: 1.6; font-size: .92rem; color: #334155;
    }
    .sum-tools { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .sum-tools button {
      border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .sum-tools .speak {
      background: linear-gradient(135deg, #4F46E5, #7C3AED); color: #fff;
    }
    .sum-tools .ghost { background: #F1F5F9; color: var(--ink); }

    .empty {
      text-align: center; padding: 28px 16px; background: #fff; border-radius: 16px;
      border: 1px dashed var(--line); color: var(--muted); font-size: .9rem; line-height: 1.5;
    }
    .empty strong { display: block; color: var(--ink); margin-bottom: 6px; }
    .gen {
      margin-top: 12px; width: 100%; height: 48px; border: 0; border-radius: 14px;
      background: linear-gradient(135deg, #4F46E5, #7C3AED); color: #fff;
      font-weight: 800; cursor: pointer; font-family: inherit;
    }
    .gen:disabled { opacity: .6; }
      .note-sheet, .summary-paper {
      background: repeating-linear-gradient(
        transparent, transparent 31px, #BFDBFE 31px, #BFDBFE 32px
      ), linear-gradient(90deg, transparent 0, transparent 28px, #FCA5A5 28px, #FCA5A5 30px, transparent 30px) !important;
      background-color: #F8FAFC !important;
      line-height: 32px !important;
      padding: 16px 14px 20px 36px !important;
    }
    .note-sheet {
      background-color: #F7FBFC;
      background-image:
        linear-gradient(#3f87a6 1px, transparent 1px),
        linear-gradient(to right, transparent 0, transparent 39px, #c73030 39px, #c73030 40px, transparent 40px);
      background-size: 100% 28px, 100% 100%;
      background-position: 0 12px, 0 0;
      border: 1px solid #D6E4EA;
      border-radius: 12px;
      padding: 18px 16px 20px 48px;
      min-height: 200px;
      color: #0F172A;
      font-size: .92rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6);
    }
    .note-sheet h2, .note-sheet h3, .note-sheet h4 { font-weight: 800; }
    .note-sheet strong { color: #1E3A8A; }
    .tool-bar {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; justify-content: center;
    }
    .tool-btn {
      width: 52px; height: 52px; border-radius: 16px; border: 0;
      display: grid; place-items: center; cursor: pointer;
      background: #EEF2FF; color: #4338CA;
      box-shadow: 0 4px 12px rgba(79,70,229,.12);
      transition: transform .18s cubic-bezier(.22,1,.36,1), background .2s, box-shadow .2s;
    }
    .tool-btn:active { transform: scale(.92); }
    .tool-btn.nova { background: linear-gradient(145deg,#4F46E5,#7C3AED); color:#fff; box-shadow:0 8px 20px rgba(79,70,229,.35); }
    .tool-btn.dl { background: #ECFDF5; color: #047857; }
    .tool-btn.share { background: #EFF6FF; color: #1D4ED8; }
    .tool-btn.speak { background: #FEF3C7; color: #B45309; }
    .tool-btn.copy { background: #F1F5F9; color: #334155; }
    .tool-btn svg { width: 22px; height: 22px; }
    .tool-label {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: .65rem; font-weight: 700; color: #64748B;
    }
    .note-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .note-actions button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-family:inherit;cursor:pointer;font-size:.8rem;background:#EEF2FF;color:#3730A3}
    .note-actions button.dl{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff}
    
    .overlay-sheet {
      position: fixed; inset: 0; z-index: 200; background: rgba(15,23,42,.55);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 16px; backdrop-filter: blur(6px);
    }
    .overlay-sheet[hidden] { display: none !important; }
    .sheet-card {
      width: min(420px, 100%); background: #fff; border-radius: 22px 22px 18px 18px;
      padding: 20px 18px 16px; box-shadow: 0 -8px 40px rgba(15,23,42,.2);
    }
    .sheet-card h3 { margin: 0 0 4px; font-size: 1.1rem; color: #0F172A; }
    .sheet-lead { margin: 0 0 14px; font-size: .82rem; color: #64748B; line-height: 1.45; }
    .sheet-btns { display: grid; gap: 8px; }
    .sheet-btn {
      display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px;
      border-radius: 14px; border: 1.5px solid #E2E8F0; background: #F8FAFC;
      color: #0F172A; font-weight: 700; font-size: .9rem; font-family: inherit; cursor: pointer;
    }
    .sheet-btn.primary { background: linear-gradient(135deg,#22C55E,#16A34A); color: #fff; border-color: transparent; }
    .sheet-btn.ghost-green {
      background: #ECFDF5; color: #15803D; border-color: #A7F3D0; justify-content: center;
    }
    .sheet-btn svg { flex-shrink: 0; }
    .toast-dl {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: #0F172A; color: #fff; padding: 12px 18px; border-radius: 14px;
      font-size: .85rem; font-weight: 600; z-index: 300; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    
    .quiz-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; font-size: .75rem; font-weight: 700; color: #64748B;
    }
    .quiz-timer {
      font-variant-numeric: tabular-nums; font-size: .95rem;
      color: #4F46E5; background: #EEF2FF; padding: 6px 12px; border-radius: 999px;
    }
    
    /* Notebook paper for summary */
    .summary-paper {
      background: repeating-linear-gradient(
        transparent,
        transparent 31px,
        #BFDBFE 31px,
        #BFDBFE 32px
      ), linear-gradient(90deg, transparent 0, transparent 28px, #FCA5A5 28px, #FCA5A5 30px, transparent 30px);
      background-color: #F8FAFC;
      border-radius: 16px;
      padding: 20px 16px 20px 36px;
      line-height: 32px;
      color: #0F172A;
      font-size: 0.95rem;
      min-height: 280px;
      box-shadow: inset 0 0 0 1px #E2E8F0;
    }
    .summary-paper h3, .summary-paper strong {
      color: #1E3A8A;
      font-weight: 800;
    }
    .summary-paper p { margin: 0 0 0.25em; }
</style>

<body class="app-body" data-page="ai">
  <div class="page">
    <div class="head">
      <a href="study-lab.html" aria-label="Back">←</a>
      <h1 id="title">Document</h1>
    </div>
    <p class="meta" id="meta"></p>

    <div class="tabs" role="tablist">
      <button type="button" class="on" data-tab="cards">Flashcards</button>
      <button type="button" data-tab="quiz">Quiz</button>
      <button type="button" data-tab="summary">Summary</button>
      <button type="button" data-tab="file">Source</button>
    </div>

    <div class="panel on" id="panel-cards">
      <div id="cardsBox"></div>
    </div>
    <div class="panel" id="panel-quiz">
      <div id="quizBox"></div>
    </div>
    <div class="panel" id="panel-summary">
      <div id="sumBox"></div>
    </div>
    <div class="panel" id="panel-file">
      <div id="fileBox"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="../js/firestore-boot.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/app-auth.js"></script>
  <script src="../js/codex-quota.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/auto-scroll.js"></script>
  <script>
  (function () {
    "use strict";
    var params = new URLSearchParams(location.search);
    var docId = params.get("id");
    var user, db, profile = {}, docData = null;
    var cardIndex = 0;
    var cards = [];

    function formatNotes(raw) {
      var s = escape(String(raw || ""));
      // headings
      s = s.replace(/^### (.+)$/gm, '<h4 style="margin:14px 0 6px;font-size:1rem;color:#1E3A8A">$1</h4>');
      s = s.replace(/^## (.+)$/gm, '<h3 style="margin:16px 0 8px;font-size:1.1rem;color:#1E3A8A">$1</h3>');
      s = s.replace(/^# (.+)$/gm, '<h2 style="margin:18px 0 10px;font-size:1.2rem;color:#0F172A">$1</h2>');
      // bold + italic
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|\s)\*([^*]+)\*(?=\s|$)/g, "$1<em>$2</em>");
      // bullet lines
      s = s.replace(/^\s*[-*] (.+)$/gm, '<div style="padding-left:12px;margin:4px 0">• $1</div>');
      s = s.replace(/^\s*\d+\. (.+)$/gm, '<div style="padding-left:12px;margin:4px 0">$1</div>');
      // paragraphs
      s = s.replace(/\n\n/g, "</p><p style=\"margin:8px 0;line-height:1.55\">");
      s = s.replace(/\n/g, "<br>");
      return '<p style="margin:0;line-height:1.55">' + s + "</p>";
    }
    function escape(s) {
      return String(s || "").replace(/[&<>"']/g, function (m) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m];
      });
    }

    document.querySelectorAll(".tabs button").forEach(function (btn) {
      btn.onclick = function () {
        document.querySelectorAll(".tabs button").forEach(function (b) { b.classList.remove("on"); });
        document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("on"); });
        btn.classList.add("on");
        document.getElementById("panel-" + btn.getAttribute("data-tab")).classList.add("on");
      };
    });

    
    var NOVA_API = "https://codex-backend-new.onrender.com/chat";
    function sourceBlob(doc) {
      var t = (doc && (doc.extractedText || doc.sourceText || doc.textContent || "")) || "";
      return String(t).trim().slice(0, 28000);
    }
    function parseJsonBlock(raw) {
      var s = String(raw || "").trim();
      var fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (fence) s = fence[1].trim();
      var a0 = s.indexOf("[");
      var a1 = s.lastIndexOf("]");
      if (a0 >= 0 && a1 > a0) {
        try { return JSON.parse(s.slice(a0, a1 + 1)); } catch (e) {}
      }
      var o0 = s.indexOf("{");
      var o1 = s.lastIndexOf("}");
      if (o0 >= 0 && o1 > o0) {
        try { return JSON.parse(s.slice(o0, o1 + 1)); } catch (e) {}
      }
      return null;
    }
    function callStudyAI(userPrompt, systemExtra) {
      var system =
        "You are Nova Study Lab for Codex Hub (Nigerian university students). " +
        "Follow the user format exactly. Prefer content grounded in the provided SOURCE TEXT. " +
        "If SOURCE TEXT is thin, still produce useful study material from the title/topic, and note that source text was limited. " +
        (systemExtra || "");
      return fetch(NOVA_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: system,
          messages: [{ role: "user", content: userPrompt }]
        })
      }).then(function (r) {
        if (!r.ok) throw new Error("AI HTTP " + r.status);
        return r.json();
      }).then(function (data) {
        var c = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if (!c && data && data.reply) c = data.reply;
        if (!c) throw new Error("Empty AI reply");
        return c;
      });
    }

    function renderCards() {
      var box = document.getElementById("cardsBox");
      if (!cards.length) {
        box.innerHTML =
          '<div class="empty"><strong>No flashcards yet</strong>Generate a starter set from this document title. Uses the text extracted from your upload + the Nova AI backend.</div>' +
          '<button type="button" class="gen" id="genCards">Generate cards with AI</button>';
        document.getElementById("genCards").onclick = function () {
          var topic = docData.title || docData.fileName || "this topic";
          var __lim = window.CodexQuota ? CodexQuota.labLimits((profile && (profile.subscriptionTier || profile.plan)) || "free") : { flashMax: 15 };
          var n = Math.min(Math.max(docData.targetFlashcards || __lim.flashDef || 8, 4), __lim.flashMax || 15);
          var src = sourceBlob(docData);
          var btn = document.getElementById("genCards");
          if (btn) { btn.disabled = true; btn.textContent = "Generating with AI…"; }
          var prompt =
            "Create " + n + " flashcards for university revision on: " + topic + ".\n" +
            (src
              ? "SOURCE TEXT from the student's document (use this heavily):\n" + src + "\n\n"
              : "No extracted document text was available — use the topic title and standard syllabus knowledge for " + topic + ".\n\n") +
            "Return ONLY a JSON array of objects with keys q and a. No markdown outside JSON. " +
            "Each q is a clear question; each a is a concise accurate answer from the source when possible.";
          callStudyAI(prompt, "Output valid JSON array only.")
            .then(function (raw) {
              var parsed = parseJsonBlock(raw);
              var list = Array.isArray(parsed) ? parsed : (parsed && parsed.cards) || [];
              cards = list.map(function (item, i) {
                return {
                  q: String((item && (item.q || item.question)) || ("Key idea " + (i + 1) + " — " + topic)).slice(0, 400),
                  a: String((item && (item.a || item.answer)) || "").slice(0, 800)
                };
              }).filter(function (c) { return c.q && c.a; });
              if (!cards.length) throw new Error("Could not parse flashcards");
              docData.flashcards = cards;
              saveArtifacts();
              renderCards();
            })
            .catch(function (err) {
              console.warn(err);
              alert((err && err.message) || "Could not generate flashcards. Check connection / backend.");
              if (btn) { btn.disabled = false; btn.textContent = "Generate cards with AI"; }
            });
        };
        return;
      }
      var c = cards[cardIndex];
      box.innerHTML =
        '<div class="fc-count">' + (cardIndex + 1) + " / " + cards.length + " · tap card to flip</div>" +
        '<div class="fc-stage"><div class="fc" id="fc">' +
          '<div class="face front">' + escape(c.q) + "</div>" +

          iconBtn("dl","noteDl",ICO.dl,"Download") +
          iconBtn("speak","noteSpeak",ICO.mic,"Read") +
          iconBtn("nova","noteNova",ICO.nova,"Ask Nova") +
        "</div>";
      bindNoteActions(sum);
    }

    function renderFile() {
      var box = document.getElementById("fileBox");
      if (!docData) return;
      box.innerHTML =
        '<div class="q-card">' +
          "<p><strong>" + escape(docData.fileName || docData.title || "File") + "</strong></p>" +
          (docData.fileUrl
            ? '<p><a href="' + escape(docData.fileUrl) + '" target="_blank" rel="noopener" style="color:#4F46E5;font-weight:700">Open source file →</a></p>'
            : "<p style=\"color:#64748B\">No file URL stored for this folder.</p>") +
        "</div>";
    }

    function saveArtifacts() {
      if (!docId || !user) return;
      var quizArr = docData.quiz || loadQuiz(docData) || [];
      var sumText = docData.summary || loadSummary(docData) || "";
      db.collection("study_lab_documents").doc(docId).set({
        flashcards: cards,
        quiz: quizArr,
        summary: sumText,
        outputs: {
          flashcards: JSON.stringify(cards),
          quiz: JSON.stringify(quizArr),
          summary: sumText
        },
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(function (err) { console.warn(err); });
    }


    function parseMaybeJson(val) {
      if (val == null) return null;
      if (typeof val === "string") {
        try { return JSON.parse(val); } catch (e) { return null; }
      }
      return val;
    }
    function loadFlashcards(data) {
      var raw = null;
      if (Array.isArray(data.flashcards)) raw = data.flashcards;
      else if (Array.isArray(data.cards)) raw = data.cards;
      else if (data.outputs) {
        raw = parseMaybeJson(data.outputs.flashcards);
      }
      if (!Array.isArray(raw)) return [];
      return raw.map(function (c) {
        if (typeof c === "string") return { q: c, a: "" };
        return {
          q: c.q || c.front || c.question || c.prompt || "",
          a: c.a || c.back || c.answer || c.response || ""
        };
      }).filter(function (c) { return c.q; });
    }
    function loadQuiz(data) {
      var raw = null;
      if (Array.isArray(data.quiz)) raw = data.quiz;
      else if (Array.isArray(data.questions)) raw = data.questions;
      else if (data.outputs) {
        raw = parseMaybeJson(data.outputs.quiz);
      }
      if (!Array.isArray(raw)) return [];
      return raw.map(function (item) {
        var q = item.q || item.question || "";
        var options = item.options || item.choices || [];
        if (!Array.isArray(options)) options = [];
        options = options.map(function (o) { return String(o).replace(/^[A-D][\.\)]\s*/i, "").trim(); });
        var ans = item.ans;
        if (ans == null && item.answer != null) {
          var answerStr = String(item.answer).replace(/^[A-D][\.\)]\s*/i, "").trim();
          ans = options.findIndex(function (o) {
            return o.toLowerCase() === answerStr.toLowerCase();
          });
          if (ans < 0) ans = 0;
        }
        if (typeof ans !== "number") ans = 0;
        return { q: q, options: options, ans: ans };
      }).filter(function (item) { return item.q && item.options.length; });
    }
    function loadSummary(data) {
      if (data.summary) return data.summary;
      if (data.outputs) {
        if (data.outputs.summary) return data.outputs.summary;
        if (data.outputs.notes) return data.outputs.notes;
        if (Array.isArray(data.outputs.keyPoints)) {
          return data.outputs.keyPoints.map(function (k, i) { return (i + 1) + ". " + k; }).join("\n");
        }
      }
      return "";
    }

    function paint() {
      (function () {
        var rawT = docData.title || docData.fileName || "Document";
        var tEl = document.getElementById("title");
        tEl.textContent = rawT;
        tEl.title = rawT; // full name on long-press / hover
      })();
      document.getElementById("meta").textContent =
        [docData.courseCode || docData.detectedSubject, docData.fileName].filter(Boolean).join(" · ") || "Study Lab folder";
      cards = loadFlashcards(docData);
      cardIndex = 0;
      renderCards();
      renderQuiz();
      renderSummary();
      renderFile();
    }

    CodexShell.mountShell({ page: "ai", title: "Study Lab", user: { fullName: "Student" } });
    CodexAuth.requireUser().then(function (res) {
      user = res.user;
      db = res.db;
      profile = res.profile || {};
      CodexShell.mountShell({
        page: "ai",
        title: "Study Lab",
        profile: profile,
        user: { fullName: profile.fullName || profile.displayName || user.displayName }
      });
      if (!docId) {
        location.href = "study-lab.html";
        return;
      }
      db.collection("study_lab_documents").doc(docId).get()
        .then(function (snap) {
          if (!snap.exists) {
            document.getElementById("title").textContent = "Not found";
            return;
          }
          docData = snap.data() || {};
          docData.id = snap.id;
          if (docData.uid && docData.uid !== user.uid) {
            document.getElementById("title").textContent = "Not found";
            return;
          }
          paint();
        })
        .catch(function (err) {
          document.getElementById("meta").textContent = err.message || "Load failed";
        });
    });
  })();
  </script>
</body>
</html>
