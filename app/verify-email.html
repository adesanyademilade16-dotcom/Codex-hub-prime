<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Verify email · Codex Hub</title>
  <script src="js/theme-boot.js"></script>
  <style>
    :root {
      --navy: #0F172A; --blue: #4F46E5; --muted: #64748B; --line: #E2E8F0; --bg: #F8FAFC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--navy);
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line);
      border-radius: 20px; padding: 28px 22px; box-shadow: 0 12px 40px rgba(15,23,42,.08);
    }
    .logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg,#4F46E5,#7C3AED);
      display: grid; place-items: center; color: #fff; font-weight: 900; margin-bottom: 16px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; font-weight: 800; }
    p { margin: 0 0 12px; color: var(--muted); line-height: 1.55; font-size: .92rem; }
    .email { font-weight: 700; color: var(--navy); word-break: break-all; }
    .tip {
      background: #EEF2FF; border: 1px solid #C7D2FE; border-radius: 12px;
      padding: 12px 14px; font-size: .82rem; color: #3730A3; margin: 14px 0 18px; line-height: 1.5;
    }
    .actions { display: grid; gap: 10px; }
    button, a.btn {
      appearance: none; border: 0; border-radius: 12px; padding: 13px 16px;
      font-weight: 800; font-size: .9rem; cursor: pointer; text-align: center; text-decoration: none;
      font-family: inherit;
    }
    .pri { background: linear-gradient(135deg,#4F46E5,#7C3AED); color: #fff; }
    .ghost { background: #fff; border: 1.5px solid var(--line) !important; color: var(--navy); }
    .danger { background: #FEF2F2; color: #B91C1C; border: 1.5px solid #FECACA !important; }
    #status { min-height: 1.2em; font-size: .82rem; margin-top: 12px; color: var(--muted); }
    #status.ok { color: #047857; }
    #status.err { color: #B91C1C; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">CX</div>
    <h1>Verify your email</h1>
    <p>We sent a link to <span class="email" id="email">your inbox</span>. Open it to activate your Codex Hub account.</p>
    <div class="tip">
      <strong>Check Spam / Promotions.</strong> Gmail and some schools put the mail there.
      After you tap the link, return here and press <strong>I’ve verified — continue</strong>.
    </div>
    <div class="actions">
      <button type="button" class="pri" id="btnContinue">I’ve verified — continue</button>
      <button type="button" class="ghost" id="btnResend">Resend verification email</button>
      <button type="button" class="danger" id="btnSignOut">Sign out</button>
    </div>
    <div id="status"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
  (function () {
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    var auth = firebase.auth();
    var status = document.getElementById("status");
    function setStatus(msg, kind) {
      status.textContent = msg || "";
      status.className = kind || "";
    }
    function isPasswordUser(user) {
      var ps = (user && user.providerData) || [];
      return ps.some(function (p) { return p && p.providerId === "password"; });
    }
    function routeUser(user) {
      return firebase.firestore().collection("users").doc(user.uid).get().then(function (snap) {
        var p = snap.exists ? snap.data() : {};
        if (!p.faculty || !p.department || !p.level) location.href = "chooseFaculty.html";
        else location.href = "app/home.html";
      }).catch(function () { location.href = "app/home.html"; });
    }
    auth.onAuthStateChanged(function (user) {
      if (!user) { location.href = "login.html"; return; }
      document.getElementById("email").textContent = user.email || "your inbox";
      // Google-only users shouldn't land here
      var hasGoogle = (user.providerData || []).some(function (p) { return p && p.providerId === "google.com"; });
      if (user.emailVerified || (hasGoogle && !isPasswordUser(user))) {
        routeUser(user);
      }
    });
    document.getElementById("btnContinue").onclick = function () {
      var user = auth.currentUser;
      if (!user) return;
      setStatus("Checking…");
      user.reload().then(function () {
        if (auth.currentUser.emailVerified) {
          setStatus("Verified — opening Codex Hub…", "ok");
          routeUser(auth.currentUser);
        } else {
          setStatus("Not verified yet. Open the link in your email (check Spam), then try again.", "err");
        }
      }).catch(function (e) { setStatus(e.message || "Could not refresh status.", "err"); });
    };
    document.getElementById("btnResend").onclick = function () {
      var user = auth.currentUser;
      if (!user) return;
      setStatus("Sending…");
      user.sendEmailVerification().then(function () {
        setStatus("Email sent. Check inbox and Spam.", "ok");
      }).catch(function (e) {
        setStatus(e.message || "Could not resend. Wait a minute and try again.", "err");
      });
    };
    document.getElementById("btnSignOut").onclick = function () {
      auth.signOut().then(function () { location.href = "login.html"; });
    };
  })();
  </script>
</body>
</html>
