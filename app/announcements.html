<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme-boot.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Announcements · Codex Hub</title><meta name="theme-color" content="#4F46E5"><link rel="icon" href="../assets/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/shell.css"><style>body.app-body{background:#F5F7FB;font-family:"Plus Jakarta Sans",system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 36px}.head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:16px}.eyebrow{font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6366F1}.head h1{margin:4px 0;font-size:1.55rem;letter-spacing:-.03em}.head p{margin:0;color:#64748B;font-size:.8rem}.actions{display:flex;gap:7px}.btn{border:0;border-radius:11px;padding:10px 12px;font:800 .72rem system-ui;cursor:pointer}.btn-primary{background:#4F46E5;color:#fff}.btn-ghost{background:#fff;color:#334155;border:1px solid #E2E8F0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ann{background:#fff;border:1px solid #E2E8F0;border-radius:18px;overflow:hidden;box-shadow:0 7px 22px rgba(15,23,42,.035);display:flex;flex-direction:column}.media{aspect-ratio:16/8;background:#EEF2FF;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:15px}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#EEF2FF;color:#4338CA;font-size:.61rem;font-weight:800}.important{background:#FFF7ED;color:#C2410C}.ann h2{font-size:.95rem;line-height:1.35;margin:9px 0 6px}.ann p{font-size:.77rem;line-height:1.55;color:#64748B;margin:0}.meta{margin-top:11px;font-size:.64rem;color:#94A3B8;font-weight:700}.cta{margin-top:12px;display:inline-flex;text-decoration:none;align-items:center;justify-content:center;border-radius:10px;padding:9px 11px;background:#0F172A;color:#fff;font-size:.7rem;font-weight:800}.unread{box-shadow:0 0 0 2px #C7D2FE,0 7px 22px rgba(79,70,229,.08)}.empty{padding:48px 16px;text-align:center;color:#94A3B8;font-size:.84rem;grid-column:1/-1}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.actions{display:none}}@media(min-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style>
<style id="ann-fix-fix">
  .page, main, .wrap { max-width: 100%; overflow-x: hidden; box-sizing: border-box; }
  .top, .header, .page-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; }
  .top h1, .header h1 { font-size: 1.05rem; margin: 0; flex: 1; min-width: 0; }
  .card, .ann-card, article { max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
  img { max-width: 100%; height: auto; }
  a { word-break: break-all; }
</style>

<style id="ann-responsive">
html,body{overflow-x:hidden;max-width:100vw}
.page,.wrap,.layout,.grid,#list,#grid{max-width:100%;box-sizing:border-box}
.header,.topbar,header{flex-wrap:wrap;gap:8px}
.header h1,.topbar h1{font-size:1.1rem;word-break:break-word}
.form-card,form,.card{max-width:100%;overflow-x:hidden}
input,textarea,select,button{max-width:100%;box-sizing:border-box}
img{max-width:100%;height:auto}
.list-item,.ann{max-width:100%;overflow:hidden}
@media(max-width:600px){
  .layout{display:block!important}
  .sidebar{display:none}
  .header{padding:10px 12px}
}
</style>
</head>
<body class="app-body"><div id="shell-root"></div><main class="wrap"><header class="head"><div><div class="eyebrow">Codex Hub updates</div><h1>Announcements</h1><p>Important updates, new features, resources and community news.</p></div><div class="actions"><button class="btn btn-ghost" id="markAll">Mark all read</button><button class="btn btn-primary" id="cancel">Close</button></div></header><section class="grid" id="grid"><div class="empty">Loading announcements…</div></section></main>
<script src="../js/firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="../js/app-auth.js"></script><script src="../js/media.js"></script><script src="../js/shell.js"></script><script>
(function(){if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);var db=firebase.firestore(),uid,items=[],readMap={};function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}function ms(v){if(!v)return 0;if(v.toMillis)return v.toMillis();return Number(v)||0}function safeUrl(v){var s=String(v||'').trim();if(/^https:\/\//i.test(s))return s;if(/^[\w./-]+\.html(?:[?#].*)?$/i.test(s))return s;return ''}async function load(){var snap=await db.collection('announcements').where('status','==','active').limit(40).get();var now=Date.now();items=snap.docs.map(d=>({id:d.id,...d.data()})).filter(a=>(!ms(a.startAt)||ms(a.startAt)<=now)&&(!ms(a.expiresAt)||now<ms(a.expiresAt))).sort((a,b)=>(Number(b.priority)||0)-(Number(a.priority)||0)||ms(b.createdAt)-ms(a.createdAt));var r=await db.collection('announcement_reads').doc(uid).get();readMap=r.exists?(r.data().states||{}):{};render();}function render(){var g=document.getElementById('grid');if(!items.length){g.innerHTML='<div class="empty">You are all caught up. No active announcements right now.</div>';return}g.innerHTML=items.map(a=>{var read=!!readMap[a.id],url=safeUrl(a.ctaUrl);return '<article class="ann '+(read?'':'unread')+'" data-id="'+esc(a.id)+'">'+(a.imageUrl?'<div class="media"><img src="'+esc(a.imageUrl)+'" alt=""></div>':'')+'<div class="body">'+(a.important?'<span class="tag important">Important</span>':'<span class="tag">'+esc(a.type||'Update')+'</span>')+'<h2>'+esc(a.title||'Announcement')+'</h2><p>'+esc(a.description||'')+'</p><div class="meta">'+(ms(a.createdAt)?new Date(ms(a.createdAt)).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'')+'</div>'+(a.ctaText&&url?'<a class="cta" href="'+esc(url)+'">'+esc(a.ctaText)+'</a>':'')+'</div></article>'}).join('');g.querySelectorAll('.ann').forEach(el=>el.addEventListener('click',async e=>{if(e.target.closest('a')){await mark(el.dataset.id,'clicked');return}await mark(el.dataset.id,'seen');el.classList.remove('unread')}));}async function mark(id,status){readMap[id]=status;var ref=db.collection('announcement_reads').doc(uid);var patch={};patch['states.'+id]=status;patch.updatedAt=firebase.firestore.FieldValue.serverTimestamp();try{await ref.set(patch,{merge:true})}catch(e){console.warn(e)}}async function markAll(){var batch=db.batch();items.forEach(a=>{var ref=db.collection('announcement_reads').doc(uid);var patch={};patch['states.'+a.id]='seen';patch.updatedAt=firebase.firestore.FieldValue.serverTimestamp();batch.set(ref,patch,{merge:true})});if(items.length)await batch.commit();items.forEach(a=>readMap[a.id]='seen');render();}CodexAuth.requireUser().then(async r=>{uid=r.user.uid;CodexShell.mountShell({page:'home',title:'Announcements',user:r.user,profile:r.profile});document.getElementById('markAll').onclick=markAll;document.getElementById('cancel').onclick=()=>location.href='home.html';try{await load()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Could not load announcements. Please try again.</div>'}}).catch(()=>location.href='../login.html');})();</script></body></html>
