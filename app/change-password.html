<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme-boot.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Change password · Codex Hub</title>
  <meta name="theme-color" content="#4F46E5">
  <link rel="icon" href="../assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/shell.css">
  <style>
    :root {
      --indigo: #4F46E5; --violet: #7C3AED; --ink: #0F172A;
      --muted: #64748B; --line: #E8ECF4; --font: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body.app-body { margin: 0; font-family: var(--font); background: #F1F5F9; color: var(--ink); }
    .page { max-width: 480px; margin: 0 auto; padding: 12px 14px 32px; }
    @media (min-width: 960px) { .page { padding-top: 24px; } }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .top a {
      width: 40px; height: 40px; border-radius: 12px; background: #fff; border: 1px solid var(--line);
      display: grid; place-items: center; text-decoration: none; color: var(--ink); font-weight: 700;
    }
    .top h1 { font-size: 1.15rem; margin: 0; font-weight: 800; }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px;
      box-shadow: 0 8px 24px rgba(15,23,42,.05);
    }
    .lead { color: var(--muted); font-size: .9rem; line-height: 1.5; margin: 0 0 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .78rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
    .pw-wrap { position: relative; }
    .pw-wrap input {
      width: 100%; height: 48px; border-radius: 12px; border: 1.5px solid var(--line);
      padding: 0 44px 0 12px; font: inherit;
    }
    .pw-wrap input:focus { outline: none; border-color: #818CF8; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
    .eye-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border: 0; background: transparent; border-radius: 10px;
      color: #94A3B8; cursor: pointer; display: grid; place-items: center; z-index: 2;
    }
    .btn {
      width: 100%; height: 52px; border: 0; border-radius: 14px; margin-top: 6px;
      font-weight: 800; color: #fff; cursor: pointer; font-family: inherit; font-size: .95rem;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%);
      transform: translateX(-120%); animation: beam 3s ease-in-out infinite;
    }
    @keyframes beam {
      0%, 50% { transform: translateX(-120%); }
      70% { transform: translateX(120%); }
      100% { transform: translateX(120%); }
    }
    .btn:disabled { opacity: .65; cursor: wait; }
    .btn-ghost {
      background: #F1F5F9; color: var(--ink); margin-top: 10px;
    }
    .btn-ghost::after { display: none; }
    .alert { display: none; padding: 12px; border-radius: 12px; font-size: .85rem; font-weight: 600; margin-bottom: 12px; }
    .alert.show { display: block; }
    .alert.ok { background: #ECFDF5; color: #065F46; }
    .alert.err { background: #FEF2F2; color: #991B1B; }
    .hint { font-size: .75rem; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  </style>

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body class="app-body" data-page="profile">
  <div class="page">
    <div class="top">
      <a href="profile.html" aria-label="Back">←</a>
      <h1>Change password</h1>
    </div>
    <div class="card">
      <p class="lead">Use your current password, then choose a new one. Google-only accounts should set a password from Edit profile or use “Forgot password” on login.</p>
      <div class="alert" id="alert"></div>
      <form id="form">
        <div class="field">
          <label for="current">Current password</label>
          <div class="pw-wrap">
            <input id="current" type="password" autocomplete="current-password" required minlength="6">
            <button type="button" class="eye-btn" data-target="current" aria-label="Show password"></button>
          </div>
        </div>
        <div class="field">
          <label for="next">New password</label>
          <div class="pw-wrap">
            <input id="next" type="password" autocomplete="new-password" required minlength="8">
            <button type="button" class="eye-btn" data-target="next" aria-label="Show password"></button>
          </div>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <div class="pw-wrap">
            <input id="confirm" type="password" autocomplete="new-password" required minlength="8">
            <button type="button" class="eye-btn" data-target="confirm" aria-label="Show password"></button>
          </div>
        </div>
        <button class="btn" type="submit" id="saveBtn">Update password</button>
      </form>
      <button class="btn btn-ghost" type="button" id="forgotBtn">Send reset link to my email</button>
      <p class="hint">Forgot your current password? We’ll email a secure reset link (same as the login screen).</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="../js/firestore-boot.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/app-auth.js"></script>
  <script src="../js/shell.js"></script>
  <script>
  (function () {
    "use strict";
    var openIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    var closedIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    document.querySelectorAll(".eye-btn").forEach(function (btn) {
      btn.innerHTML = openIcon;
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        var input = document.getElementById(btn.getAttribute("data-target"));
        if (!input) return;
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.innerHTML = show ? closedIcon : openIcon;
      });
    });

    function alertMsg(msg, ok) {
      var a = document.getElementById("alert");
      a.textContent = msg;
      a.className = "alert show " + (ok ? "ok" : "err");
    }

    CodexShell.mountShell({ page: "profile", title: "Password", user: { fullName: "Student" } });

    CodexAuth.requireUser().then(function (res) {
      var user = res.user;
      CodexShell.mountShell({ page: "profile", title: "Password", user: { fullName: res.profile.fullName || user.displayName } });

      document.getElementById("forgotBtn").onclick = function () {
        if (!user.email) return alertMsg("No email on this account.");
        user.auth.sendPasswordResetEmail
          ? null
          : null;
        firebase.auth().sendPasswordResetEmail(user.email)
          .then(function () { alertMsg("Reset link sent to " + user.email + ". Check inbox and spam.", true); })
          .catch(function (err) { alertMsg(err.message || "Could not send reset email."); });
      };

      document.getElementById("form").onsubmit = function (e) {
        e.preventDefault();
        var cur = document.getElementById("current").value;
        var next = document.getElementById("next").value;
        var conf = document.getElementById("confirm").value;
        if (next.length < 8) return alertMsg("New password must be at least 8 characters.");
        if (next !== conf) return alertMsg("New passwords do not match.");
        var btn = document.getElementById("saveBtn");
        btn.disabled = true;
        btn.textContent = "Updating…";
        var cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
        user.reauthenticateWithCredential(cred)
          .then(function () { return user.updatePassword(next); })
          .then(function () {
            alertMsg("Password updated. Use it next time you sign in.", true);
            btn.disabled = false;
            btn.textContent = "Update password";
            document.getElementById("form").reset();
          })
          .catch(function (err) {
            btn.disabled = false;
            btn.textContent = "Update password";
            var map = {
              "auth/wrong-password": "Current password is incorrect.",
              "auth/invalid-credential": "Current password is incorrect.",
              "auth/weak-password": "New password is too weak.",
              "auth/requires-recent-login": "Please sign out and sign in again, then retry."
            };
            alertMsg(map[err.code] || err.message || "Could not update password.");
          });
      };
    });
  })();
  </script>
</body>
</html>
